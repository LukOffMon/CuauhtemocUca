        function changeView(view, param = '') {
            if (LEGACY_VIEWS[view]) { tasksFilter.platform = LEGACY_VIEWS[view][1]; view = 'tasks'; }
            const v = VIEWS.find(x => x.id === view) || VIEWS[0];
            const target = '#' + v.hash + (param ? '/' + encodeURIComponent(param) : '');
            if (location.hash !== target) { history.pushState(null, '', target); }
            showView(v.id, param);
        }
        function showView(view, param = '') {
            if (!isInApp()) {
                $('entry-screen').classList.add('hidden');
                $('app-header').classList.remove('hidden');
                $('app-main').classList.remove('hidden');
                $('bottom-nav').classList.remove('hidden');
                document.body.classList.add('in-app');
            }
            currentView = view; viewParam = param;
            updateNavStyles(view);
            const container = $('content-container');
            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');
            renderView(view);
            window.scrollTo({ top: 0 });
            updateNavBadge(); updateUrgentBar();
        }
        function routeFromHash() {
            const h = decodeURIComponent(location.hash.replace(/^#/, ''));
            if (!h || h.startsWith('sync=')) { if (isInApp()) showView('today'); return; }
            const [hash, ...rest] = h.split('/');
            const v = VIEWS.find(x => x.hash === hash || x.id === hash);
            if (v) showView(v.id, rest.join('/'));
            else showView('today');
        }
        window.addEventListener('popstate', () => {
            if (!location.hash || location.hash === '#') { if (isInApp()) goEntry(); return; }
            routeFromHash();
        });
        function refreshAll() {
            if (isInApp()) renderView(currentView); else renderEntryScreen();
            updateNavBadge(); updateUrgentBar(); tickCountdowns();
        }

        // =================================================================
        // RENDER DE VISTAS
        // =================================================================
        function renderView(view) {
            const container = $('content-container');
            const title = $('view-title');
            const map = {
                today: renderToday, week: renderWeek, calendar: renderCalendar, tasks: renderTasks, exams: renderExamsView,
                subjects: renderSubjects, subject: renderSubjectDetail, study: renderStudy, tools: renderTools, settings: renderSettings
            };
            try { (map[view] || renderToday)(container, title); }
            catch (err) {
                console.error(err);
                container.innerHTML = `<div class="surface-card rounded-xl p-6 text-center"><p class="font-bold text-gray-900">Algo salió mal al mostrar esta sección.</p>
                    <p class="text-sm text-gray-500 mt-1">${esc(err.message)}</p><button onclick="changeView('today')" class="btn btn-brand mt-4">Volver a Hoy</button></div>`;
            }
            tickCountdowns();
        }

        // ---------------------------------------------------------------
        // HOY
        // ---------------------------------------------------------------
        let todayViewDate = null; // null = hoy real
        function shiftTodayDate(n) {
            const base = todayViewDate ? fromKey(todayViewDate) : new Date();
            const d = addDays(base, n);
            todayViewDate = sameDay(d, new Date()) ? null : dateKey(d);
            renderView('today');
        }
        function setTodayDate(k) { todayViewDate = k && k !== todayKey() ? k : null; renderView('today'); }
        function setDayView(v) { P.dayView = v; savePrefs(); renderView('today'); }

        function heroHtml(st) {
            const nextLine = st.next ? `<p class="text-sm text-white/85 mt-3"><i class="fa-solid fa-arrow-right mr-1"></i>Después: <b>${esc(st.next.item.subject)}</b>
                ${st.next.sameDay ? '' : relDay(st.next.day) + ','} a las ${st.next.item.start} <span class="text-white/65">(en ${formatMinutes((st.next.at - Date.now()) / MIN)})</span></p>` : '';
            const wrap = (bg, inner) => `<section class="rounded-2xl p-5 sm:p-6 text-white shadow-md mb-5 relative overflow-hidden" style="background:${bg}" aria-live="polite">${inner}${nextLine}</section>`;
            if (st.state === 'class') {
                const c = st.current, nm = nowMinutes(), pct = clamp((nm - c.startMin) / (c.endMin - c.startMin) * 100, 0, 100);
                const col = safeColor(c.color);
                return wrap(`linear-gradient(135deg, ${col}, ${mix(col, '#000000', .45)})`, `
                    <p class="text-xs font-bold uppercase tracking-widest text-white/75">${c.isExam ? '📝 Estás en examen' : 'Estás en clase'} · hasta las ${c.end}${c.room ? ` · Aula ${esc(c.room)}` : ''}</p>
                    <h3 class="text-2xl sm:text-3xl font-extrabold mt-1 leading-tight">${esc(c.subject)}</h3>
                    <div class="h-2.5 rounded-full bg-white/25 overflow-hidden mt-4"><div class="h-full bg-white rounded-full" style="width:${pct.toFixed(1)}%"></div></div>
                    <p class="text-sm text-white/85 mt-2">Quedan <b class="tabular-nums" data-left="${atTime(new Date(), c.end).getTime()}">${fmtDuration(atTime(new Date(), c.end) - Date.now())}</b> · ${Math.round(pct)}% de la ${c.isExam ? 'prueba' : 'clase'}</p>`);
            }
            const simple = (kicker, title, bg = 'linear-gradient(135deg, var(--brand-dark), var(--brand-deep))') => wrap(bg, `
                <p class="text-xs font-bold uppercase tracking-widest text-white/75">${kicker}</p>
                <h3 class="text-2xl font-extrabold mt-1 leading-tight">${title}</h3>`);
            switch (st.state) {
                case 'recess': return simple(`Hasta las ${st.recess.end} · quedan <span class="tabular-nums" data-left="${atTime(new Date(), st.recess.end).getTime()}"></span>`, 'Receso 🍎', 'linear-gradient(135deg,#d97706,#92400e)');
                case 'before': return simple(`Hoy entras a las ${st.items[0].start}`, `Aún no empiezan tus ${st.items[0].isExam ? 'exámenes' : 'clases'}`);
                case 'gap': return simple('Hora libre', 'No tienes clase ahorita');
                case 'after_school': return simple(st.exam ? 'Presentaste tus exámenes de hoy' : 'Buen trabajo hoy', 'Terminaste por hoy 🏠', 'linear-gradient(135deg,#15803d,#14532d)');
                case 'weekend': return simple(`Es ${daysOfWeek[new Date().getDay()].toLowerCase()}`, 'Sin clases, disfruta el fin de semana', 'linear-gradient(135deg,#7c3aed,#4c1d95)');
                case 'holiday': return simple('Día sin clases', esc(st.holiday.label || 'Descanso'), 'linear-gradient(135deg,#0284c7,#075985)');
                default: return simple('Hoy', st.exam ? 'Hoy no presentas examen' : 'Sin clases registradas');
            }
        }

        function railHtml(day, items) {
            const recess = recessFor(day);
            const first = Math.min(...items.map(i => i.startMin), recess ? recess.startMin : 1440);
            const last = Math.max(...items.map(i => i.endMin), recess ? recess.endMin : 0);
            const start = Math.floor(first / 60) * 60, end = Math.ceil(last / 60) * 60;
            const k = 1.15, y = m => ((m - start) * k).toFixed(1);
            const isToday = sameDay(day, new Date()), nm = nowMinutes();
            const hours = []; for (let m = start; m <= end; m += 60) hours.push(m);
            return `<div class="rail" style="height:${((end - start) * k).toFixed(0)}px">
                ${hours.map(m => `<div class="rail-hour" style="top:${y(m)}px"><span>${minToHHMM(m)}</span></div>`).join('')}
                ${recess ? `<div class="rail-recess" style="top:${y(recess.startMin)}px;height:${((recess.endMin - recess.startMin) * k).toFixed(1)}px"><span><i class="fa-solid fa-mug-hot mr-1"></i>Receso ${recess.start}–${recess.end}</span></div>` : ''}
                ${items.map(it => {
                    const active = isToday && nm >= it.startMin && nm < it.endMin && !(recess && nm >= recess.startMin && nm < recess.endMin);
                    const past = isToday && nm >= it.endMin;
                    const h = (it.endMin - it.startMin) * k;
                    return `<button type="button" ${active ? 'id="current-class-card"' : ''} onclick="${it.isExam ? `openExamDetail('${it.id}')` : `openClassEditor('${it.id}')`}"
                        class="rail-block ${active ? 'is-now' : ''} ${past ? 'is-past' : ''}" style="top:${y(it.startMin)}px;height:${(h - 4).toFixed(1)}px;${subjStyle(it.color)}"
                        aria-label="${esc(it.subject)}, ${it.start} a ${it.end}${active ? ', ahora' : ''}">
                        <span class="rt">${it.start}–${it.end}${active ? ' · AHORA' : ''}</span>
                        <span class="rs">${it.isExam ? '<i class="fa-solid fa-file-signature mr-1"></i>' : ''}${esc(it.subject)}</span>
                        ${it.room && h > 50 ? `<span class="rr"><i class="fa-solid fa-door-open mr-1"></i>${esc(it.room)}</span>` : ''}
                    </button>`;
                }).join('')}
                ${isToday && nm >= start && nm <= end ? `<div class="rail-now" style="top:${y(nm)}px"><span>${minToHHMM(Math.floor(nm))}</span></div>` : ''}
            </div>`;
        }
        function cardsHtml(day, items) {
            const isToday = sameDay(day, new Date()), nm = nowMinutes();
            return `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${items.map(it => {
                const isCurrent = isToday && nm >= it.startMin && nm < it.endMin;
                return `<button type="button" onclick="${it.isExam ? `openExamDetail('${it.id}')` : `openClassEditor('${it.id}')`}" ${isCurrent ? 'id="current-class-card"' : ''}
                    class="text-left bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border overflow-hidden flex flex-col ${isCurrent ? 'border-[var(--brand-light)] ring-2 ring-[var(--brand-light)] ring-offset-2' : 'border-gray-100'}" style="--tw-ring-offset-color: var(--brand-bg)">
                    <div class="h-2 w-full" style="background:${safeColor(it.color)}"></div>
                    <div class="p-5 flex-grow flex flex-col justify-between w-full">
                        <div class="flex items-center justify-between gap-2 text-gray-500 mb-2">
                            <span class="flex items-center gap-2"><i class="fa-regular fa-clock"></i><span class="font-medium text-sm">${it.start} - ${it.end}</span></span>
                            ${isCurrent ? '<span class="bg-[var(--brand-light)] text-white text-xs font-bold px-2 py-0.5 rounded-full">AHORA</span>' : it.isExam ? '<span class="pill pill-exam">EXAMEN</span>' : ''}
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 mb-3 leading-tight">${esc(it.subject)}</h3>
                        <div class="flex items-center gap-2 bg-gray-50 p-2.5 rounded-lg border border-gray-100">
                            <i class="fa-solid fa-door-open text-[var(--brand-light)] opacity-80"></i>
                            <span class="text-sm font-semibold text-gray-700">Aula: ${esc(it.room || '—')}</span>
                        </div>
                    </div></button>`;
            }).join('')}</div>`;
        }

        function miniTaskRow(d) {
            return `<div class="flex items-start gap-2.5 py-2">
                <input type="checkbox" ${d.completed ? 'checked' : ''} onchange="toggleTaskCompleted('${d.id}')" class="mt-1 w-4 h-4 rounded cursor-pointer flex-shrink-0" aria-label="Marcar como completada">
                <button onclick="openTaskDetail('${d.id}')" class="text-left min-w-0 flex-grow">
                    <p class="text-[11px] font-bold uppercase tracking-wide" style="color:${safeColor(d.color)}">${esc(d.kind === 'aleks' ? 'ALEKS' : d.subject)}</p>
                    <p class="text-sm font-semibold text-gray-900 leading-snug ${d.completed ? 'line-through opacity-60' : ''}">${esc(d.title)}</p>
                    <div class="mt-1">${countdownChip(d)}</div>
                </button></div>`;
        }

        function renderToday(container, title) {
            const now = new Date();
            const realToday = !todayViewDate;
            let day = realToday ? new Date() : fromKey(todayViewDate);
            let weekendNote = '';
            if (realToday && (now.getDay() === 0 || now.getDay() === 6) && !itemsForDate(now).length) {
                const nx = nextItemAfter(now);
                if (nx) { day = nx.day; weekendNote = `¡Feliz fin de semana! Mostrando el horario del ${daysOfWeek[day.getDay()].toLowerCase()} ${fmtShort(day)}.`; }
            }
            const isRealDay = sameDay(day, now);
            title.innerHTML = isRealDay ? `Horario para hoy: <span class="text-[var(--brand-light)]">${daysOfWeek[day.getDay()]}</span>`
                : `Horario del <span class="text-[var(--brand-light)]">${daysOfWeek[day.getDay()].toLowerCase()} ${fmtShort(day)}</span>`;
            const items = itemsForDate(day);
            const st = getScheduleStatus(now);
            const period = examPeriodFor(day), hol = holidayFor(day);

            const dayNav = `<div class="flex items-center gap-2 mb-4 flex-wrap no-print">
                <button onclick="shiftTodayDate(-1)" class="btn btn-ghost btn-sm" aria-label="Día anterior"><i class="fa-solid fa-chevron-left"></i></button>
                <button onclick="setTodayDate(null)" class="btn btn-sm ${realToday ? 'btn-brand' : 'btn-ghost'}">Hoy</button>
                <button onclick="shiftTodayDate(1)" class="btn btn-ghost btn-sm" aria-label="Día siguiente"><i class="fa-solid fa-chevron-right"></i></button>
                <input type="date" value="${dateKey(day)}" onchange="setTodayDate(this.value)" class="field py-1 text-xs" aria-label="Elegir fecha">
                <span class="flex-grow"></span>
                <div class="flex gap-1">
                    <button onclick="setDayView('rail')" class="tool-chip ${P.dayView === 'rail' ? 'active' : ''}" title="Línea de tiempo"><i class="fa-solid fa-timeline"></i></button>
                    <button onclick="setDayView('cards')" class="tool-chip ${P.dayView === 'cards' ? 'active' : ''}" title="Tarjetas"><i class="fa-solid fa-table-cells-large"></i></button>
                </div>
                <button onclick="shareDay('${dateKey(day)}')" class="btn btn-ghost btn-sm" title="Compartir el horario de este día"><i class="fa-solid fa-share-nodes"></i></button>
                <button onclick="openClassEditor(null, ${day.getDay()})" class="btn btn-ghost btn-sm"><i class="fa-solid fa-plus"></i><span class="hidden sm:inline">Clase</span></button>
            </div>`;

            let notes = '';
            if (weekendNote) notes += `<div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4 rounded-r-md text-sm text-blue-700"><i class="fa-solid fa-circle-info mr-2"></i>${weekendNote}</div>`;
            if (hol) notes += `<div class="bg-sky-50 border-l-4 border-sky-500 p-4 mb-4 rounded-r-md text-sm text-sky-800"><i class="fa-solid fa-umbrella-beach mr-2"></i>Día sin clases: <b>${esc(hol.label)}</b></div>`;
            if (period) notes += `<div class="bg-red-50 border-l-4 border-red-500 p-4 mb-4 rounded-r-md flex items-center gap-3">
                <i class="fa-solid fa-file-signature text-red-500 text-xl"></i>
                <p class="text-sm text-red-800 font-medium">${esc(period.label)}: ${items.length ? 'hoy presentas examen, no hay clases.' : 'este día no tienes examen.'} Confirma aula e indicaciones con tu docente o Coordinación.</p></div>`;
            const r = recessFor(day);
            if (isRealDay && st.state === 'recess') notes += `<div class="mb-4 bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-md flex items-center gap-3">
                <i class="fa-solid fa-mug-hot text-amber-500 text-xl"></i><p class="text-sm text-amber-800 font-medium">Ahorita es receso (${r.start} - ${r.end}), sin importar lo que diga el horario.</p></div>`;

            const schedule = items.length === 0
                ? `<div class="surface-card rounded-xl p-8 text-center"><i class="fa-regular fa-calendar text-4xl text-gray-300 mb-3"></i><p class="text-gray-500">No hay clases registradas para este día.</p>
                    <button onclick="openClassEditor(null, ${day.getDay()})" class="btn btn-ghost mt-4"><i class="fa-solid fa-plus"></i>Agregar clase</button></div>`
                : (P.dayView === 'cards' ? cardsHtml(day, items) : `<div class="surface-card rounded-xl p-4 pt-6">${railHtml(day, items)}</div>`);

            // Columna lateral
            const nowMs = Date.now();
            const dayStart = new Date(day); dayStart.setHours(0, 0, 0, 0);
            const dayEnd = new Date(day); dayEnd.setHours(23, 59, 59, 999);
            const all = getDeadlines();
            const myDay = all.filter(d => d.myDay === dateKey(day));
            const dueThatDay = all.filter(d => !d.completed && d.due >= dayStart && d.due <= dayEnd && d.myDay !== dateKey(day));
            const upcoming = getPendingDeadlines().filter(d => d.opens.getTime() <= nowMs && d.due.getTime() > nowMs && !myDay.some(m => m.id === d.id)).slice(0, 4);
            const nextExams = DB.exams.map(e => ({ e, ...examTimes(e) })).filter(x => x.end > nowMs && x.start - nowMs < 14 * DAY).sort((a, b) => a.start - b.start).slice(0, 3);

            const side = `
                <div class="surface-card rounded-xl p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-1">
                        <p class="font-bold text-gray-900"><i class="fa-solid fa-sun text-amber-500 mr-2"></i>Mi día</p>
                        <span class="text-xs text-gray-500">${myDay.filter(d => d.completed).length}/${myDay.length}</span>
                    </div>
                    ${myDay.length ? `<div class="divide-y divide-gray-100">${myDay.map(miniTaskRow).join('')}</div>`
                        : `<p class="text-xs text-gray-500 mt-1">Elige qué tareas harás ${isRealDay ? 'hoy' : 'ese día'}: toca <i class="fa-regular fa-sun"></i> en cualquier tarea.</p>`}
                    ${dueThatDay.length ? `<p class="sec-title mt-3 mb-1">Vencen ${isRealDay ? 'hoy' : 'ese día'}</p><div class="divide-y divide-gray-100">${dueThatDay.map(miniTaskRow).join('')}</div>` : ''}
                </div>
                <div class="surface-card rounded-xl p-4 shadow-sm">
                    <p class="font-bold text-gray-900 mb-1"><i class="fa-solid fa-bell text-amber-500 mr-2"></i>Próximas entregas</p>
                    ${upcoming.length ? `<div class="divide-y divide-gray-100">${upcoming.map(miniTaskRow).join('')}</div>` : '<p class="text-sm text-gray-500"><i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i>Nada pendiente abierto.</p>'}
                    <button onclick="changeView('tasks')" class="text-xs font-semibold brand-text mt-2 hover:underline">Ver todas las tareas →</button>
                </div>
                ${nextExams.length ? `<button onclick="changeView('exams')" class="w-full text-left surface-card rounded-xl p-4 shadow-sm border-l-4" style="border-left-color:#ef4444">
                    <p class="font-bold text-gray-900 mb-2"><i class="fa-solid fa-file-signature text-red-500 mr-2"></i>Próximos exámenes</p>
                    ${nextExams.map(x => `<div class="flex items-center justify-between gap-2 py-1"><span class="text-sm font-semibold text-gray-800 truncate">${esc(x.e.subject)}<span class="block text-xs font-normal text-gray-500">${relDay(x.day)} · ${x.e.start}</span></span>${examChip(x.e)}</div>`).join('')}
                </button>` : ''}`;

            container.innerHTML = `${dayNav}${isRealDay ? heroHtml(st) : ''}${notes}
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                    <div class="lg:col-span-2" id="day-swipe">${schedule}</div>
                    <div class="space-y-4">${side}</div>
                </div>`;
            enableSwipe($('day-swipe'), dir => shiftTodayDate(dir));
        }
        // Deslizar a la izquierda/derecha para cambiar de día
        function enableSwipe(el, cb) {
            if (!el) return;
            let x0 = null, y0 = null;
            el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
            el.addEventListener('touchend', e => {
                if (x0 === null) return;
                const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
                if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) cb(dx < 0 ? 1 : -1);
                x0 = null;
            }, { passive: true });
        }
        function shareText(title, text) {
            if (navigator.share) { navigator.share({ title, text }).catch(() => {}); return; }
            copyText(text, 'Copiado al portapapeles. Pégalo en WhatsApp o donde quieras 📋');
        }
        function copyText(text, okMsg = 'Copiado 📋') {
            const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); showToast(okMsg, 'ok', 3000); } catch (e) { showToast('No se pudo copiar.', 'warn'); } t.remove(); };
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => showToast(okMsg, 'ok', 3000), fallback); else fallback();
        }
        function shareDay(k) {
            const day = fromKey(k), items = itemsForDate(day);
            const head = `📅 ${fmtDate(day)}${P.group ? ' · ' + P.group : ''}`;
            const lines = items.length ? items.map(i => `${i.start}-${i.end} ${i.isExam ? '📝 ' : ''}${i.subject}${i.room ? ' (' + i.room + ')' : ''}`) : ['Sin clases'];
            shareText('Mi horario', [head, ...lines].join('\n'));
        }

        // ---------------------------------------------------------------
        // SEMANA
        // ---------------------------------------------------------------
        function setWeekView(v) { P.weekView = v; savePrefs(); renderView('week'); }
        function renderWeek(container, title) {
            title.textContent = 'Semana Completa';
            const todayIdx = new Date().getDay();
            const used = new Set(DB.classes.map(c => c.day));
            const days = [1, 2, 3, 4, 5, ...(used.has(6) ? [6] : []), ...(used.has(0) ? [0] : [])];
            const nowMs = Date.now();
            const period = DB.examPeriods.find(p => fromKey(p.end).getTime() + DAY > nowMs && fromKey(p.start).getTime() - nowMs < 14 * DAY);
            let html = `<div class="flex flex-wrap gap-2 mb-4 no-print">
                <button onclick="openClassEditor()" class="btn btn-brand"><i class="fa-solid fa-plus"></i>Agregar clase</button>
                <span class="flex-grow"></span>
                <button onclick="setWeekView('grid')" class="tool-chip ${P.weekView === 'grid' ? 'active' : ''}"><i class="fa-solid fa-table-columns mr-1"></i>Cuadrícula</button>
                <button onclick="setWeekView('list')" class="tool-chip ${P.weekView === 'list' ? 'active' : ''}"><i class="fa-solid fa-list mr-1"></i>Lista</button>
                <button onclick="exportClassesICS()" class="btn btn-ghost btn-sm"><i class="fa-regular fa-calendar-plus"></i>.ics</button>
                <button onclick="window.print()" class="btn btn-ghost btn-sm"><i class="fa-solid fa-print"></i>Imprimir</button>
            </div>`;
            if (period) html += `<button onclick="changeView('exams')" class="w-full mb-4 text-left bg-red-50 border-l-4 border-red-500 p-3 rounded-r-md flex items-center gap-3 hover:opacity-90 no-print">
                <i class="fa-solid fa-file-signature text-red-500"></i>
                <span class="text-sm text-red-800 font-medium">Del ${fmtShort(fromKey(period.start))} al ${fmtShort(fromKey(period.end))}: ${esc(period.label)} (exámenes en lugar de clases). Toca para ver el horario.</span>
                <i class="fa-solid fa-chevron-right text-red-300 ml-auto"></i></button>`;
            if (!DB.classes.length) {
                container.innerHTML = html + `<div class="surface-card rounded-xl p-10 text-center"><i class="fa-solid fa-calendar-week text-5xl text-gray-300 mb-3"></i>
                    <p class="font-bold text-gray-900">Tu horario está vacío</p><p class="text-sm text-gray-500 mt-1">Agrega tus clases o restaura el horario de ${esc(DEFAULT_GROUP)}.</p>
                    <button onclick="restoreSeed('classes'); renderView('week')" class="btn btn-ghost mt-4">Restaurar horario original</button></div>`;
                return;
            }
            const useGrid = P.weekView === 'grid' && window.matchMedia('(min-width: 768px)').matches;
            if (useGrid) {
                const r = P.recess;
                const startM = Math.floor(Math.min(...DB.classes.map(c => toMin(c.start)), r.on ? toMin(r.start) : 1440) / 60) * 60;
                const endM = Math.ceil(Math.max(...DB.classes.map(c => toMin(c.end)), r.on ? toMin(r.end) : 0) / 60) * 60;
                const k = 1.05, y = m => ((m - startM) * k).toFixed(1), H = ((endM - startM) * k).toFixed(0);
                const hours = []; for (let m = startM; m <= endM; m += 60) hours.push(m);
                const nm = nowMinutes();
                html += `<div class="wk" style="--cols:${days.length};--h:${H}px">
                    <div></div>${days.map(d => `<div class="wk-head app-header-bg">${daysOfWeek[d].toUpperCase()}${d === todayIdx ? ' · HOY' : ''}</div>`).join('')}
                    <div class="wk-axis">${hours.map(m => `<span style="top:${y(m)}px">${minToHHMM(m)}</span>`).join('')}</div>
                    ${days.map(d => {
                        const list = DB.classes.filter(c => c.day === d);
                        return `<div class="wk-col ${d === todayIdx ? 'today' : ''}">
                            ${hours.map(m => `<span class="wk-line" style="top:${y(m)}px"></span>`).join('')}
                            ${r.on && list.length ? `<span class="wk-recess" style="top:${y(toMin(r.start))}px;height:${((toMin(r.end) - toMin(r.start)) * k).toFixed(1)}px" title="Receso"></span>` : ''}
                            ${list.map(c => `<button type="button" onclick="openClassEditor('${c.id}')" class="wk-block" style="top:${y(toMin(c.start))}px;height:${((toMin(c.end) - toMin(c.start)) * k - 3).toFixed(1)}px;${subjStyle(c.color)}" title="${esc(c.subject)} · ${c.start}-${c.end} · ${esc(c.room)}">
                                <span class="opacity-90">${c.start}–${c.end}</span><b>${esc(c.subject)}</b>${c.room ? `<span class="opacity-90">${esc(c.room)}</span>` : ''}</button>`).join('')}
                            ${d === todayIdx && nm >= startM && nm <= endM ? `<span class="wk-now" style="top:${y(nm)}px"></span>` : ''}
                        </div>`;
                    }).join('')}
                </div>`;
            } else {
                html += '<div class="grid grid-cols-1 lg:grid-cols-5 gap-4 lg:gap-2">';
                days.forEach(i => {
                    const list = DB.classes.filter(c => c.day === i).sort((a, b) => toMin(a.start) - toMin(b.start));
                    html += `<div class="bg-white rounded-lg shadow-sm border ${i === todayIdx ? 'border-[var(--brand-light)] ring-2 ring-[var(--brand-light)]' : 'border-gray-200'} overflow-hidden">
                        <div class="app-header-bg text-white p-3 text-center font-semibold">${daysOfWeek[i].toUpperCase()}${i === todayIdx ? ' · HOY' : ''}</div>
                        <div class="p-2 space-y-2">
                        ${list.length ? list.map(c => `<button type="button" onclick="openClassEditor('${c.id}')" class="w-full text-left p-3 rounded-md flex flex-col gap-1 shadow-sm text-sm" style="${subjStyle(c.color)}">
                            <span class="font-bold opacity-90"><i class="fa-regular fa-clock mr-1"></i>${c.start} - ${c.end}</span>
                            <span class="font-semibold leading-tight line-clamp-2" title="${esc(c.subject)}">${esc(c.subject)}</span>
                            ${c.room ? `<span class="text-xs bg-white/20 px-2 py-0.5 rounded-full w-max mt-1 border border-white/30">Aula ${esc(c.room)}</span>` : ''}</button>`).join('')
                            : '<div class="p-3 text-center text-sm text-gray-400">Sin clases</div>'}
                        <button onclick="openClassEditor(null, ${i})" class="w-full text-xs muted py-1.5 rounded-md border border-dashed hairline no-print hover:opacity-80"><i class="fa-solid fa-plus mr-1"></i>Agregar</button>
                        </div></div>`;
                });
                html += '</div>';
            }
            // Horas por materia a la semana
            const hrs = {};
            DB.classes.forEach(c => { hrs[c.subject] = (hrs[c.subject] || 0) + (toMin(c.end) - toMin(c.start)); });
            const total = Object.values(hrs).reduce((a, b) => a + b, 0), maxH = Math.max(...Object.values(hrs), 1);
            html += `<div class="surface-card rounded-xl p-5 mt-6 shadow-sm">
                <p class="font-bold text-gray-900 mb-3"><i class="fa-solid fa-chart-simple brand-text mr-2"></i>Horas de clase por semana <span class="text-sm font-semibold text-gray-400">(${formatMinutes(total)} en total)</span></p>
                <div class="space-y-2">${Object.entries(hrs).sort((a, b) => b[1] - a[1]).map(([s, m]) => `
                    <div class="flex items-center gap-3 text-sm"><span class="w-44 sm:w-64 truncate text-gray-700" title="${esc(s)}">${esc(s)}</span>
                    <div class="flex-grow bar-track" style="height:10px"><div class="bar-fill" style="width:${(m / maxH * 100).toFixed(0)}%;background:${safeColor(subjectColor(s))}"></div></div>
                    <span class="w-14 text-right tabular-nums text-gray-500">${formatMinutes(m)}</span></div>`).join('')}</div>
                <p class="text-xs text-gray-400 mt-3 no-print">Toca cualquier clase para editarla o eliminarla.</p></div>`;
            container.innerHTML = html;
        }

        // ---------------------------------------------------------------
        // CALENDARIO MENSUAL
        // ---------------------------------------------------------------
        let calMonth = null, calSel = null;
        function calShift(n) { const d = calMonth ? fromKey(calMonth + '-01') : new Date(); d.setDate(1); d.setMonth(d.getMonth() + n); calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; renderView('calendar'); }
        function calPick(k) { calSel = k; renderView('calendar'); }
        function renderCalendar(container, title) {
            const now = new Date();
            if (!calMonth) calMonth = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
            if (!calSel) calSel = todayKey();
            const first = fromKey(calMonth + '-01');
            title.innerHTML = `<span class="text-pink-600"><i class="fa-solid fa-calendar mr-2"></i>Calendario</span>`;
            const gridStart = startOfWeek(first);
            const deadlines = getDeadlines();
            const byDay = {};
            const push = (k, x) => { (byDay[k] = byDay[k] || []).push(x); };
            deadlines.forEach(d => push(dateKey(d.due), { type: 'task', d }));
            DB.exams.forEach(e => push(e.date, { type: 'exam', e }));
            const cells = [];
            for (let i = 0; i < 42; i++) {
                const d = addDays(gridStart, i), k = dateKey(d), list = byDay[k] || [];
                if (i === 35 && d.getMonth() !== first.getMonth()) break;
                const hol = holidayFor(d), per = examPeriodFor(d);
                const pending = list.filter(x => x.type === 'task' && !x.d.completed).length;
                const heat = pending ? `background:color-mix(in srgb, #f59e0b ${Math.min(10 + pending * 9, 45)}%, var(--surface))` : '';
                cells.push(`<button onclick="calPick('${k}')" class="cal-day ${d.getMonth() !== first.getMonth() ? 'out' : ''} ${k === todayKey() ? 'today' : ''} ${k === calSel ? 'sel' : ''}" style="${heat}">
                    <span class="num">${d.getDate()}${hol ? ' <i class="fa-solid fa-umbrella-beach text-sky-500 text-[10px]"></i>' : ''}${per ? ' <i class="fa-solid fa-file-signature text-red-500 text-[10px]"></i>' : ''}</span>
                    <span class="cal-dots">${list.slice(0, 8).map(x => x.type === 'exam' ? `<i style="background:#ef4444;border-radius:2px"></i>` : `<i style="background:${x.d.completed ? '#9ca3af' : safeColor(x.d.color)}"></i>`).join('')}</span>
                    ${list.slice(0, 2).map(x => `<span class="cal-tag" style="background:${x.type === 'exam' ? '#ef4444' : safeColor(x.d.color)}">${esc(x.type === 'exam' ? x.e.subject : x.d.title)}</span>`).join('')}
                </button>`);
            }
            const sel = fromKey(calSel), selList = byDay[calSel] || [], selItems = itemsForDate(sel), selHol = holidayFor(sel);
            const monthName = first.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                    <div class="lg:col-span-2">
                        <div class="flex items-center gap-2 mb-3">
                            <button onclick="calShift(-1)" class="btn btn-ghost btn-sm" aria-label="Mes anterior"><i class="fa-solid fa-chevron-left"></i></button>
                            <p class="font-bold text-gray-900 text-lg capitalize flex-grow text-center">${monthName}</p>
                            <button onclick="calShift(1)" class="btn btn-ghost btn-sm" aria-label="Mes siguiente"><i class="fa-solid fa-chevron-right"></i></button>
                            <button onclick="calMonth=null; calSel=null; renderView('calendar')" class="btn btn-ghost btn-sm">Hoy</button>
                        </div>
                        <div class="cal mb-1">${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="cal-dow">${d}</div>`).join('')}</div>
                        <div class="cal" id="cal-swipe">${cells.join('')}</div>
                        <p class="text-xs text-gray-400 mt-2 flex flex-wrap gap-x-4 gap-y-1"><span><i class="fa-solid fa-circle text-amber-400"></i> El color del día indica cuántas entregas pendientes hay</span>
                            <span><i class="fa-solid fa-square text-red-500"></i> Examen</span><span><i class="fa-solid fa-umbrella-beach text-sky-500"></i> Día sin clases</span></p>
                    </div>
                    <div class="surface-card rounded-xl p-4 shadow-sm self-start">
                        <p class="font-bold text-gray-900 capitalize">${fmtDate(sel)}</p>
                        ${selHol ? `<p class="text-sm text-sky-700 mt-1"><i class="fa-solid fa-umbrella-beach mr-1"></i>${esc(selHol.label)}</p>` : ''}
                        <p class="sec-title mt-3 mb-1">${examPeriodFor(sel) ? 'Exámenes' : 'Clases'}</p>
                        ${selItems.length ? selItems.map(i => `<div class="flex items-center gap-2 py-1 text-sm"><span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${safeColor(i.color)}"></span><span class="tabular-nums text-gray-500 w-24">${i.start}–${i.end}</span><span class="font-semibold text-gray-800 truncate">${i.isExam ? '📝 ' : ''}${esc(i.subject)}</span></div>`).join('') : '<p class="text-sm text-gray-500">Sin clases.</p>'}
                        <p class="sec-title mt-3 mb-1">Entregas</p>
                        ${selList.filter(x => x.type === 'task').length ? `<div class="divide-y divide-gray-100">${selList.filter(x => x.type === 'task').map(x => miniTaskRow(x.d)).join('')}</div>` : '<p class="text-sm text-gray-500">Ninguna entrega este día.</p>'}
                        <div class="flex gap-2 mt-4 flex-wrap">
                            <button onclick="setTodayDate('${calSel}'); changeView('today')" class="btn btn-ghost btn-sm"><i class="fa-solid fa-eye"></i>Ver día</button>
                            <button onclick="openTaskEditor(null, {due:'${calSel}'})" class="btn btn-brand btn-sm"><i class="fa-solid fa-plus"></i>Tarea este día</button>
                        </div>
                    </div>
                </div>`;
            enableSwipe($('cal-swipe'), dir => calShift(dir));
        }

        // ---------------------------------------------------------------
        // Tarjeta de tarea (Moodle, ALEKS y otras)
        // ---------------------------------------------------------------
        function gcalLink(title, start, end, details = '', location = '') {
            const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
            return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + f(start) + '/' + f(end) +
                '&details=' + encodeURIComponent(details) + (location ? '&location=' + encodeURIComponent(location) : '');
        }
        function taskLinkBtn(d) {
            if (d.link) return `<a href="${esc(d.link)}" target="_blank" rel="noopener" class="text-xs font-semibold text-sky-600 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Abrir actividad</a>`;
            if (d.kind === 'aleks') return `<a href="${esc(getAleksUrl())}" target="_blank" rel="noopener" class="text-xs font-semibold text-emerald-600 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Abrir ALEKS</a>`;
            if (d.kind === 'moodle') return `<button onclick="openMoodle()" class="text-xs font-semibold text-purple-600 hover:underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Abrir Moodle</button>`;
            return '';
        }
        function taskCard(d) {
            const now = Date.now();
            const ms = d.due.getTime() - now;
            const notOpen = d.opens.getTime() > now;
            let badge = ['Con tiempo', 'bg-gray-100 text-gray-500'];
            if (d.completed) badge = ['Completada', 'bg-emerald-100 text-emerald-700'];
            else if (ms <= 0) badge = ['Vencida', 'bg-red-100 text-red-700'];
            else if (notOpen) badge = ['Aún no abre', 'bg-gray-100 text-gray-500'];
            else if (d.inExtra) badge = ['Plazo extra', 'bg-amber-100 text-amber-700'];
            else if (ms <= 24 * HOUR) badge = ['Vence pronto', 'bg-amber-100 text-amber-700'];
            else if (ms <= 168 * HOUR) badge = ['Esta semana', 'bg-orange-100 text-orange-700'];

            let details;
            if (d.kind === 'aleks' || d.finalDue) {
                details = `
                    <span><i class="fa-regular fa-calendar-plus mr-1"></i>Abre: ${fmtDay(d.opens)}</span>
                    <span><i class="fa-regular fa-calendar-xmark mr-1"></i>Cierra: ${fmtDay(d.closes)}</span>
                    ${d.finalDue ? `<span class="${d.inExtra ? 'text-orange-600 font-semibold' : ''}"><i class="fa-solid fa-flag-checkered mr-1"></i>Entrega final: ${fmtDay(d.finalDue)}</span>` : ''}`;
            } else {
                details = `
                    <span><i class="fa-regular fa-calendar-check mr-1"></i>Entrega: ${fmtDay(d.due)}</span>
                    <span><i class="fa-regular fa-calendar-plus mr-1"></i>Abre: ${fmtDay(d.opens)}</span>`;
            }
            if (d.est) details += `<span><i class="fa-regular fa-clock mr-1"></i>~${formatMinutes(d.est)}</span>`;
            const subDone = d.subtasks.filter(s => s.done).length;
            if (d.subtasks.length) details += `<span><i class="fa-solid fa-list-ul mr-1"></i>${subDone}/${d.subtasks.length} pasos</span>`;
            if (d.notes) details += `<span><i class="fa-regular fa-note-sticky mr-1"></i>Con notas</span>`;
            const heading = d.kind === 'aleks' ? d.title : d.subject;
            const body = d.kind === 'aleks' ? `Tarea de ALEKS (${d.subject || 'Cálculo Diferencial'})` : d.title;
            const inMyDay = d.myDay === todayKey();

            return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex ${d.completed ? 'opacity-65' : ''}">
                    <div class="w-1.5 flex-shrink-0" style="background:${safeColor(d.color)}"></div>
                    <div class="p-4 flex-grow flex items-start gap-3 min-w-0">
                        <input type="checkbox" ${d.completed ? 'checked' : ''} onchange="toggleTaskCompleted('${d.id}')" aria-label="Marcar como completada"
                            class="mt-1 w-5 h-5 rounded border-gray-300 text-[var(--brand-light)] focus:ring-[var(--brand-light)] cursor-pointer flex-shrink-0">
                        <div class="flex-grow min-w-0">
                            <div class="flex items-center justify-between gap-2 flex-wrap mb-1">
                                <span class="flex items-center gap-2 min-w-0">
                                    <span class="pill pill-${d.kind}">${platformLabel(d.kind)}</span>
                                    <span class="text-xs font-bold uppercase tracking-wide text-gray-500 truncate">${esc(heading)}</span>
                                    ${d.priority ? `<span class="text-amber-500 text-xs" title="Prioridad ${d.priority === 2 ? 'alta' : 'media'}">${'<i class="fa-solid fa-star"></i>'.repeat(d.priority)}</span>` : ''}
                                </span>
                                <span class="text-xs font-bold px-2 py-1 rounded-full ${badge[1]}">${badge[0]}</span>
                            </div>
                            <button onclick="openTaskDetail('${d.id}')" class="text-left font-semibold text-gray-900 leading-snug hover:underline ${d.completed ? 'line-through' : ''}">${esc(body)}</button>
                            <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-gray-500">${details}</div>
                            <div class="flex items-center justify-between gap-2 flex-wrap mt-3">
                                ${countdownChip(d)}
                                <div class="flex items-center gap-1">
                                    ${taskLinkBtn(d)}
                                    <button onclick="toggleMyDay('${d.id}')" class="icon-act ${inMyDay ? 'on' : ''}" title="${inMyDay ? 'Quitar de Mi día' : 'Agregar a Mi día'}"><i class="fa-${inMyDay ? 'solid' : 'regular'} fa-sun"></i></button>
                                    <a href="${esc(gcalLink((d.kind === 'aleks' ? 'ALEKS ' : d.subject + ': ') + d.title, new Date(d.due.getTime() - 30 * MIN), d.due, 'Entrega · Mi Horario Escolar'))}" target="_blank" rel="noopener" class="icon-act" title="Agregar a Google Calendar"><i class="fa-brands fa-google"></i></a>
                                    <button onclick="openTaskEditor('${d.id}')" class="icon-act" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                </div>
                            </div>
                            ${progressBar(d)}
                        </div>
                    </div>
                </div>`;
        }
        function toggleMyDay(id) {
            const t = findItem('tasks', id); if (!t) return;
            t.myDay = t.myDay === todayKey() ? null : todayKey();
            saveDB();
            showToast(t.myDay ? 'Agregada a Mi día ☀️' : 'Quitada de Mi día', 'ok', 2500);
            refreshAll();
        }

        // ---------------------------------------------------------------
        // TAREAS (antes: Alertas, Moodle y ALEKS)
        // ---------------------------------------------------------------
        let tasksFilter = { platform: 'all', subject: 'all', status: 'pending', q: '', sort: 'due' };
        function setTF(k, v) { tasksFilter[k] = v; if (k === 'q') renderTaskList(); else renderView('tasks'); }
        function renderTasks(container, title) {
            title.innerHTML = '<span class="text-amber-500"><i class="fa-solid fa-list-check mr-2"></i>Tareas y entregas</span>';
            const all = getDeadlines();
            const now = Date.now();
            const done = all.filter(d => d.completed);
            const pending = all.filter(d => !d.completed).sort((a, b) => a.due - b.due);
            const pctDone = all.length ? Math.round((done.length / all.length) * 100) : 0;
            const start = all.length ? Math.min(...all.map(d => d.opens.getTime())) : now;
            const end = all.length ? Math.max(...all.map(d => d.due.getTime())) : now + 1;
            const pctTime = Math.max(0, Math.min(100, Math.round(((now - start) / (end - start)) * 100)));
            const next = pending.find(d => d.due.getTime() > now && d.opens.getTime() <= now) || pending.find(d => d.due.getTime() > now);
            const weekLoad = pending.filter(d => d.due - now > 0 && d.due - now < 7 * DAY).reduce((a, d) => a + (d.est || 60), 0);
            const subjects = [...new Set(all.map(d => d.subject))].filter(Boolean);
            const [nst, nact] = notifStatusText();
            const chip = (k, v, lb) => `<button onclick="setTF('${k}','${v}')" class="tool-chip ${tasksFilter[k] === v ? 'active' : ''}">${lb}</button>`;
            const count = k => all.filter(d => d.kind === k && !d.completed).length;

            container.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                    <div class="surface-card rounded-xl p-4 shadow-sm col-span-2 md:col-span-1">
                        <p class="sec-title mb-2">Próximo vencimiento</p>
                        ${next ? `<p class="font-semibold text-gray-900 leading-snug mb-2 text-sm">${esc(next.kind === 'aleks' ? 'ALEKS · ' + next.title : next.subject + ' — ' + next.title)}</p>
                            <div>${countdownChip(next)}</div>` : `<p class="text-gray-500 text-sm">Nada pendiente por vencer 🎉</p>`}
                    </div>
                    <div class="surface-card rounded-xl p-4 shadow-sm">
                        <p class="sec-title mb-2">Completadas</p>
                        <p class="stat-big">${done.length}<span class="text-lg text-gray-400">/${all.length}</span></p>
                        <div class="bar-track mt-3"><div class="bar-fill" style="width:${pctDone}%;background:var(--brand-light)"></div></div>
                    </div>
                    <div class="surface-card rounded-xl p-4 shadow-sm">
                        <p class="sec-title mb-2">Avance del periodo</p>
                        <p class="stat-big">${pctTime}%</p>
                        <div class="bar-track mt-3"><div class="bar-fill" style="width:${pctTime}%;background:var(--brand-dark)"></div></div>
                        <p class="text-[11px] text-gray-400 mt-2">Del ${fmtShort(new Date(start))} al ${fmtShort(new Date(end))}</p>
                    </div>
                    <div class="surface-card rounded-xl p-4 shadow-sm">
                        <p class="sec-title mb-2">Carga 7 días</p>
                        <p class="stat-big">${formatMinutes(weekLoad)}</p>
                        <p class="text-[11px] text-gray-400 mt-2">Tiempo estimado de lo que vence esta semana (1 h si no lo indicas)</p>
                    </div>
                </div>

                <div class="surface-card rounded-xl p-4 mb-5 shadow-sm flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
                    <div class="text-sm text-gray-600">
                        <p class="font-semibold text-gray-900 mb-0.5">Avisos antes de cada entrega · <span class="text-xs font-semibold ${nact === 'test' ? 'text-emerald-600' : 'text-gray-500'}">${nst}</span></p>
                        <p class="text-xs text-gray-500">${P.alertSteps.map(stepLabel).join(', ')} antes. Funcionan con la app abierta; para avisos con la app cerrada, expórtalos a tu calendario.</p>
                    </div>
                    <div class="flex flex-wrap gap-2 items-center">
                        ${nact === 'on' || nact === 'help' ? `<button onclick="requestNotifPermission()" class="btn btn-brand"><i class="fa-solid fa-bell"></i>Activar alertas</button>` : ''}
                        <button onclick="exportDeadlinesICS()" class="btn btn-ghost"><i class="fa-regular fa-calendar-plus"></i>Exportar a calendario</button>
                        <button onclick="openTaskEditor()" class="btn btn-brand"><i class="fa-solid fa-plus"></i>Nueva tarea</button>
                    </div>
                </div>

                <div class="flex flex-col gap-3 mb-5">
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                        ${chip('platform', 'all', 'Todas')}${chip('platform', 'moodle', `<i class="fa-solid fa-graduation-cap mr-1 text-purple-500"></i>Moodle (${count('moodle')})`)}
                        ${chip('platform', 'aleks', `<i class="fa-solid fa-laptop-code mr-1 text-emerald-500"></i>ALEKS (${count('aleks')})`)}${chip('platform', 'otra', `<i class="fa-solid fa-thumbtack mr-1 text-sky-500"></i>Otras (${count('otra')})`)}
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <div class="col-span-2 relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                            <input id="task-search" value="${esc(tasksFilter.q)}" oninput="setTF('q', this.value)" placeholder="Buscar tarea…" class="field w-full pl-8" type="search"></div>
                        <select onchange="setTF('subject', this.value)" class="field" aria-label="Materia">
                            <option value="all">Todas las materias</option>
                            ${subjects.map(s => `<option value="${esc(s)}" ${tasksFilter.subject === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
                        </select>
                        <select onchange="setTF('status', this.value)" class="field" aria-label="Estado">
                            ${[['pending', 'Pendientes (por urgencia)'], ['week', 'Próximos 7 días'], ['overdue', 'Vencidas'], ['notopen', 'Aún no abren'], ['myday', 'Mi día'], ['done', 'Completadas'], ['all', 'Todas']]
                                .map(([k, l]) => `<option value="${k}" ${tasksFilter.status === k ? 'selected' : ''}>${l}</option>`).join('')}
                        </select>
                    </div>
                    ${tasksFilter.status !== 'pending' ? `<div class="flex gap-2 items-center text-xs text-gray-500">Ordenar:
                        ${[['due', 'Fecha'], ['priority', 'Prioridad'], ['subject', 'Materia']].map(([k, l]) => `<button onclick="setTF('sort','${k}')" class="tool-chip ${tasksFilter.sort === k ? 'active' : ''}">${l}</button>`).join('')}</div>` : ''}
                    ${tasksFilter.platform === 'aleks' ? `<div class="rounded-xl overflow-hidden shadow-md" style="background:linear-gradient(135deg,#047857,#065f46)">
                        <div class="p-4 text-white flex items-center gap-3 flex-wrap">
                            <div class="flex-grow"><p class="font-bold">Avance en ALEKS</p>
                            <div class="flex items-center gap-3 mt-2"><div class="flex-grow h-2.5 rounded-full bg-white/20 overflow-hidden"><div class="h-full bg-white rounded-full" style="width:${Math.round(all.filter(d => d.kind === 'aleks' && d.completed).length / Math.max(1, all.filter(d => d.kind === 'aleks').length) * 100)}%"></div></div>
                            <span class="text-sm font-bold tabular-nums">${all.filter(d => d.kind === 'aleks' && d.completed).length}/${all.filter(d => d.kind === 'aleks').length}</span></div></div>
                            <a href="${esc(getAleksUrl())}" target="_blank" rel="noopener" class="bg-white/15 hover:bg-white/25 border border-white/25 text-sm font-semibold px-4 py-2 rounded-lg"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Abrir ALEKS</a>
                        </div>
                        <p class="px-4 pb-3 text-xs text-emerald-100 italic">La entrega final aplica solo cuando ALEKS otorga un plazo extra tras el cierre normal. La cuenta regresiva cambia sola a ese plazo cuando se cumple el cierre.</p></div>` : ''}
                    ${tasksFilter.platform === 'moodle' ? `<button onclick="openMoodle()" class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold px-4 py-2.5 rounded-lg self-start"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Abrir Moodle</button>` : ''}
                </div>
                <div id="task-list"></div>`;
            renderTaskList();
        }
        function filteredTasks() {
            const f = tasksFilter, now = Date.now(), q = f.q.trim().toLowerCase();
            let list = getDeadlines();
            if (f.platform !== 'all') list = list.filter(d => d.kind === f.platform);
            if (f.subject !== 'all') list = list.filter(d => d.subject === f.subject);
            if (q) list = list.filter(d => (d.title + ' ' + d.subject + ' ' + d.notes).toLowerCase().includes(q));
            return list;
        }
        function renderTaskList() {
            const box = $('task-list'); if (!box) return;
            const f = tasksFilter, now = Date.now();
            let list = filteredTasks();
            const empty = msg => `<div class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400"><i class="fa-solid fa-clipboard-check text-4xl mb-3"></i><p>${msg}</p></div>`;
            if (f.status === 'pending' && !f.q.trim()) {
                const pending = list.filter(d => !d.completed).sort((a, b) => a.due - b.due);
                const done = list.filter(d => d.completed);
                const groups = [
                    ['Vencidas sin completar', 'fa-triangle-exclamation', 'text-red-500', pending.filter(d => d.due.getTime() <= now)],
                    ['Vencen en menos de 24 horas', 'fa-fire', 'text-orange-500', pending.filter(d => d.due.getTime() > now && d.due.getTime() - now <= 24 * HOUR)],
                    ['Esta semana', 'fa-calendar-week', 'text-amber-500', pending.filter(d => d.due.getTime() - now > 24 * HOUR && d.due.getTime() - now <= 168 * HOUR)],
                    ['Más adelante', 'fa-calendar', 'text-sky-500', pending.filter(d => d.due.getTime() - now > 168 * HOUR)]
                ];
                box.innerHTML = `
                    ${pending.length === 0 ? `<div class="surface-card rounded-xl p-10 text-center mb-6"><p class="text-4xl mb-2">🎉</p><p class="font-bold text-gray-900">¡Todo al día!</p><p class="text-sm text-gray-500">No tienes pendientes en este filtro.</p></div>` : ''}
                    ${groups.filter(g => g[3].length).map(g => `
                        <section class="mb-6">
                            <h3 class="font-bold text-gray-900 mb-3 flex items-center gap-2"><i class="fa-solid ${g[1]} ${g[2]}"></i>${g[0]} <span class="text-xs font-semibold text-gray-400">(${g[3].length})</span></h3>
                            <div class="space-y-3">${g[3].map(taskCard).join('')}</div>
                        </section>`).join('')}
                    ${done.length ? `<details class="mb-6"><summary class="cursor-pointer font-semibold text-gray-500 text-sm mb-3"><i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i>Completadas (${done.length})</summary>
                        <div class="space-y-3 mt-3">${done.sort((a, b) => b.due - a.due).map(taskCard).join('')}</div></details>` : ''}`;
            } else {
                if (f.status === 'pending') list = list.filter(d => !d.completed);
                if (f.status === 'week') list = list.filter(d => !d.completed && d.due - now > 0 && d.due - now <= 7 * DAY);
                if (f.status === 'overdue') list = list.filter(d => !d.completed && d.due <= now);
                if (f.status === 'notopen') list = list.filter(d => !d.completed && d.opens > now);
                if (f.status === 'myday') list = list.filter(d => d.myDay === todayKey());
                if (f.status === 'done') list = list.filter(d => d.completed);
                const sorters = { due: (a, b) => a.due - b.due, priority: (a, b) => b.priority - a.priority || a.due - b.due, subject: (a, b) => a.subject.localeCompare(b.subject) || a.due - b.due };
                list.sort(sorters[f.sort] || sorters.due);
                box.innerHTML = list.length ? `<p class="text-xs text-gray-400 mb-2">${plural(list.length, 'tarea', 'tareas')}</p><div class="space-y-3">${list.map(taskCard).join('')}</div>` : empty('No hay tareas que coincidan con este filtro.');
            }
            tickCountdowns();
        }

        // ---------------------------------------------------------------
        // Editores (clases, tareas, exámenes)
        // ---------------------------------------------------------------
        let pickedColor = PALETTE[5];
        function colorPicker(current) {
            pickedColor = safeColor(current, PALETTE[5]);
            return `<div><span class="lbl">Color</span><div class="flex flex-wrap gap-1.5 items-center" id="color-pick">
                ${PALETTE.map(c => `<button type="button" onclick="pickColor('${c}')" class="swatch ${c === pickedColor ? 'sel' : ''}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}
                <label class="swatch ${PALETTE.includes(pickedColor) ? '' : 'sel'}" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)" title="Otro color">
                    <input type="color" value="${pickedColor}" oninput="pickColor(this.value)" class="opacity-0 w-0 h-0"></label>
            </div></div>`;
        }
        function pickColor(c) {
            pickedColor = safeColor(c, pickedColor);
            document.querySelectorAll('#color-pick .swatch').forEach(s => s.classList.toggle('sel', s.style.background && hexEq(s.style.background, pickedColor)));
        }
        function hexEq(cssColor, hex) { const m = cssColor.match(/\d+/g); return m && m.length >= 3 && rgbToHex(+m[0], +m[1], +m[2]).toLowerCase() === hex.toLowerCase(); }
        function subjectDatalist() { return `<datalist id="subject-list">${allSubjects().map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>`; }
        function autoColor(input) { const s = input.value.trim(); if (allSubjects().includes(s)) pickColor(subjectColor(s)); }
        const val = id => ($(id) ? $(id).value : '');

        function openClassEditor(id = null, day = 1) {
            const c = id ? findItem('classes', id) : { day: typeof day === 'number' ? (day === 0 || day === 6 ? 1 : day) : 1, start: '07:00', end: '09:00', subject: '', room: '', color: PALETTE[5] };
            if (!c) return;
            const info = id ? subjectInfo(c.subject) : null;
            openModal(`${modalHead(id ? 'Editar clase' : 'Agregar clase', 'fa-chalkboard-user')}
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2"><label class="lbl" for="f-subject">Materia</label>
                        <input id="f-subject" list="subject-list" maxlength="80" value="${esc(c.subject)}" oninput="autoColor(this)" class="field w-full" autocomplete="off"></div>
                    <div><label class="lbl" for="f-day">Día</label><select id="f-day" class="field w-full">${[1, 2, 3, 4, 5, 6, 0].map(d => `<option value="${d}" ${d === c.day ? 'selected' : ''}>${daysOfWeek[d]}</option>`).join('')}</select></div>
                    <div><label class="lbl" for="f-room">Aula</label><input id="f-room" maxlength="30" value="${esc(c.room)}" placeholder="411B" class="field w-full"></div>
                    <div><label class="lbl" for="f-start">Empieza</label><input id="f-start" type="time" value="${c.start}" class="field w-full"></div>
                    <div><label class="lbl" for="f-end">Termina</label><input id="f-end" type="time" value="${c.end}" class="field w-full"></div>
                    <div class="col-span-2">${colorPicker(c.color)}</div>
                    ${!id ? `<label class="col-span-2 flex items-center gap-2 text-sm text-gray-600"><input type="checkbox" id="f-repeat" class="w-4 h-4"> Repetir a la misma hora de lunes a viernes</label>` : ''}
                </div>
                ${subjectDatalist()}
                ${info && (info.teacher || info.email) ? `<p class="text-xs text-gray-500 mt-3"><i class="fa-solid fa-user-tie mr-1"></i>${esc(info.teacher)} ${info.email ? '· ' + esc(info.email) : ''}</p>` : ''}
                <div class="flex items-center gap-2 mt-5 flex-wrap">
                    ${id ? `<button onclick="closeModal(); deleteItem('classes','${id}'); refreshAll()" class="btn btn-ghost text-red-600"><i class="fa-solid fa-trash"></i>Eliminar</button>
                        <button onclick="closeModal(); changeView('subject', '${jsq(c.subject)}')" class="btn btn-ghost"><i class="fa-solid fa-book"></i>Materia</button>` : ''}
                    <span class="flex-grow"></span>
                    <button onclick="closeModal()" class="btn btn-ghost">Cancelar</button>
                    <button onclick="saveClass('${id || ''}')" class="btn btn-brand">${id ? 'Guardar' : 'Agregar'}</button>
                </div>`);
        }
        function saveClass(id) {
            const subject = val('f-subject').trim(), start = val('f-start'), end = val('f-end');
            if (!subject) return showToast('Escribe el nombre de la materia.', 'warn');
            if (!TIME_RE.test(start) || !TIME_RE.test(end) || toMin(end) <= toMin(start)) return showToast('La hora de término debe ser después de la de inicio.', 'warn');
            const days = !id && $('f-repeat') && $('f-repeat').checked ? [1, 2, 3, 4, 5] : [parseInt(val('f-day'))];
            const clash = days.flatMap(d => DB.classes.filter(c => c.id !== id && c.day === d && toMin(c.start) < toMin(end) && toMin(start) < toMin(c.end)));
            days.forEach(d => upsertItem('classes', { id: id || uid('c'), day: d, start, end, subject, room: val('f-room').trim(), color: pickedColor }));
            closeModal();
            showToast(clash.length ? `Guardado. Ojo: se cruza con ${esc(clash[0].subject)} (${daysOfWeek[clash[0].day]} ${clash[0].start}).` : 'Clase guardada ✅', clash.length ? 'warn' : 'ok', 4500);
            refreshAll();
        }

        function openTaskEditor(id = null, defaults = {}) {
            const now = new Date();
            let t = id ? findItem('tasks', id) : null;
            if (id && !t) return;
            if (!t) {
                const due = defaults.due ? atTime(fromKey(defaults.due), '23:59') : atTime(addDays(now, 7), '23:59');
                t = { kind: defaults.kind || (tasksFilter.platform !== 'all' ? tasksFilter.platform : 'moodle'), subject: defaults.subject || '', title: '', opens: toLocalInput(now), due: toLocalInput(due),
                    finalDue: null, color: defaults.subject ? subjectColor(defaults.subject) : PALETTE[5], link: '', notes: '', priority: 0, est: 0, subtasks: [] };
            }
            const seedTask = id && SEED.tasks.some(s => s.id === id);
            openModal(`${modalHead(id ? 'Editar tarea' : 'Nueva tarea', 'fa-list-check')}
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2"><span class="lbl">Plataforma</span><div class="flex gap-2" id="f-kind">
                        ${[['moodle', 'Moodle'], ['aleks', 'ALEKS'], ['otra', 'Otra']].map(([k, l]) => `<button type="button" data-k="${k}" onclick="setKind('${k}')" class="tool-chip ${t.kind === k ? 'active' : ''}">${l}</button>`).join('')}
                    </div><input type="hidden" id="f-kind-v" value="${t.kind}"></div>
                    <div class="col-span-2"><label class="lbl" for="f-title">Título</label><input id="f-title" maxlength="200" value="${esc(t.title)}" placeholder="3.1 Mapa conceptual" class="field w-full"></div>
                    <div class="col-span-2"><label class="lbl" for="f-subject">Materia</label><input id="f-subject" list="subject-list" maxlength="80" value="${esc(t.subject)}" oninput="autoColor(this)" class="field w-full" autocomplete="off"></div>
                    <div><label class="lbl" for="f-open">Abre</label><input id="f-open" type="datetime-local" value="${t.opens}" class="field w-full"></div>
                    <div><label class="lbl" for="f-due" id="f-due-l">${t.kind === 'aleks' ? 'Cierra' : 'Entrega'}</label><input id="f-due" type="datetime-local" value="${t.due}" class="field w-full"></div>
                    <div class="col-span-2 ${t.kind === 'aleks' || t.finalDue ? '' : 'hidden'}" id="f-final-w"><label class="lbl" for="f-final">Entrega final con plazo extra (opcional)</label>
                        <input id="f-final" type="datetime-local" value="${t.finalDue || ''}" class="field w-full"></div>
                    <div class="col-span-2"><label class="lbl" for="f-link">Enlace a la actividad (opcional)</label><input id="f-link" type="url" value="${esc(t.link || '')}" placeholder="https://…" class="field w-full"></div>
                    <div><label class="lbl" for="f-pri">Prioridad</label><select id="f-pri" class="field w-full">${[[0, 'Normal'], [1, '★ Media'], [2, '★★ Alta']].map(([k, l]) => `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
                    <div><label class="lbl" for="f-est">Tiempo estimado (min)</label><input id="f-est" type="number" min="0" step="15" value="${t.est || ''}" placeholder="60" class="field w-full"></div>
                    <div class="col-span-2">${colorPicker(t.color)}</div>
                    <div class="col-span-2"><label class="lbl" for="f-notes">Notas</label><textarea id="f-notes" rows="2" maxlength="2000" class="field w-full" placeholder="Instrucciones, rúbrica, ideas…">${esc(t.notes || '')}</textarea></div>
                </div>
                ${subjectDatalist()}
                ${seedTask ? '<p class="text-[11px] text-gray-400 mt-3">Esta tarea viene del horario original. Si la editas, se queda con tus cambios.</p>' : ''}
                <div class="flex items-center gap-2 mt-5 flex-wrap">
                    ${id ? `<button onclick="closeModal(); deleteItem('tasks','${id}'); refreshAll()" class="btn btn-ghost text-red-600"><i class="fa-solid fa-trash"></i>Eliminar</button>
                        <button onclick="duplicateTask('${id}')" class="btn btn-ghost" title="Duplicar"><i class="fa-regular fa-copy"></i></button>` : ''}
                    <span class="flex-grow"></span>
                    <button onclick="closeModal()" class="btn btn-ghost">Cancelar</button>
                    <button onclick="saveTask('${id || ''}')" class="btn btn-brand">${id ? 'Guardar' : 'Crear tarea'}</button>
                </div>`);
        }
        function setKind(k) {
            $('f-kind-v').value = k;
            document.querySelectorAll('#f-kind .tool-chip').forEach(b => b.classList.toggle('active', b.dataset.k === k));
            $('f-due-l').textContent = k === 'aleks' ? 'Cierra' : 'Entrega';
            $('f-final-w').classList.toggle('hidden', k !== 'aleks' && !val('f-final'));
            if (k === 'aleks') { pickColor(SC.aleks); if (!val('f-subject')) $('f-subject').value = 'Cálculo Diferencial'; }
        }
        function saveTask(id) {
            const title = val('f-title').trim(), subject = val('f-subject').trim(), opens = val('f-open'), due = val('f-due'), fin = val('f-final');
            if (!title) return showToast('Escribe el título de la tarea.', 'warn');
            if (!DT_RE.test(opens) || !DT_RE.test(due)) return showToast('Revisa las fechas de apertura y entrega.', 'warn');
            if (parseLocal(due) <= parseLocal(opens)) return showToast('La entrega debe ser después de la apertura.', 'warn');
            if (fin && DT_RE.test(fin) && parseLocal(fin) <= parseLocal(due)) return showToast('El plazo extra debe ser después del cierre.', 'warn');
            const linkRaw = val('f-link'), link = sanitizeUrl(linkRaw);
            if (linkRaw.trim() && !link) return showToast('El enlace no parece válido.', 'warn');
            const old = id ? findItem('tasks', id) : null;
            upsertItem('tasks', {
                id: id || uid('t'), kind: val('f-kind-v'), subject, title, opens, due, finalDue: DT_RE.test(fin) ? fin : null, color: pickedColor, link,
                notes: val('f-notes'), priority: parseInt(val('f-pri')) || 0, est: Math.max(0, parseInt(val('f-est')) || 0),
                myDay: old ? old.myDay : null, subtasks: old ? old.subtasks || [] : []
            });
            closeModal();
            showToast(id ? 'Tarea actualizada ✅' : 'Tarea creada ✅', 'ok', 2500);
            refreshAll();
        }
        function duplicateTask(id) {
            const t = findItem('tasks', id); if (!t) return;
            const copy = { ...clone(t), id: uid('t'), title: t.title + ' (copia)', myDay: null, subtasks: (t.subtasks || []).map(s => ({ t: s.t, done: false })) };
            upsertItem('tasks', copy); closeModal(); openTaskEditor(copy.id); showToast('Tarea duplicada.', 'ok', 2500);
        }

        // Detalle de tarea: pasos (subtareas), notas y acciones rápidas
        function openTaskDetail(id) {
            const d = getDeadlines().find(x => x.id === id); if (!d) return;
            const steps = d.subtasks;
            openModal(`${modalHead(esc(d.kind === 'aleks' ? 'ALEKS · ' + d.title : d.subject), 'fa-clipboard-list')}
                <div class="flex items-center gap-2 flex-wrap mb-2"><span class="pill pill-${d.kind}">${platformLabel(d.kind)}</span>${countdownChip(d)}</div>
                <p class="font-bold text-gray-900 text-lg leading-snug">${esc(d.title)}</p>
                <p class="text-xs text-gray-500 mt-1">Abre ${fmtDay(d.opens)} · ${d.inExtra ? 'Entrega final' : 'Entrega'} ${fmtDay(d.due)}</p>
                ${progressBar(d)}
                <p class="sec-title mt-5 mb-2">Pasos (${steps.filter(s => s.done).length}/${steps.length})</p>
                <div class="space-y-1.5" id="steps">${steps.map((s, i) => `<label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleStep('${id}', ${i})" class="w-4 h-4">
                    <span class="flex-grow ${s.done ? 'line-through text-gray-400' : 'text-gray-800'}">${esc(s.t)}</span>
                    <button onclick="removeStep('${id}', ${i})" class="icon-act" aria-label="Quitar paso"><i class="fa-solid fa-xmark text-xs"></i></button></label>`).join('') || '<p class="text-xs text-gray-400">Divide la tarea en pasos pequeños: investigar, redactar, revisar…</p>'}</div>
                <div class="flex gap-2 mt-2"><input id="step-new" class="field flex-grow" placeholder="Nuevo paso" maxlength="200" onkeydown="if(event.key==='Enter')addStep('${id}')">
                    <button onclick="addStep('${id}')" class="btn btn-ghost"><i class="fa-solid fa-plus"></i></button></div>
                <p class="sec-title mt-5 mb-2">Notas</p>
                <textarea rows="3" class="field w-full" maxlength="2000" oninput="saveTaskNote('${id}', this.value)" placeholder="Apuntes de esta tarea (se guardan solos)">${esc(d.notes)}</textarea>
                <div class="flex flex-wrap gap-2 mt-5">
                    <button onclick="closeModal(); toggleTaskCompleted('${id}')" class="btn ${d.completed ? 'btn-ghost' : 'btn-brand'}"><i class="fa-solid fa-circle-check"></i>${d.completed ? 'Marcar pendiente' : 'Completar'}</button>
                    <button onclick="toggleMyDay('${id}'); openTaskDetail('${id}')" class="btn btn-ghost"><i class="fa-${d.myDay === todayKey() ? 'solid' : 'regular'} fa-sun text-amber-500"></i>Mi día</button>
                    <button onclick="startPomoFor('${jsq(d.subject)}')" class="btn btn-ghost"><i class="fa-solid fa-stopwatch"></i>Pomodoro</button>
                    <button onclick="closeModal(); openTaskEditor('${id}')" class="btn btn-ghost"><i class="fa-solid fa-pen"></i>Editar</button>
                    ${taskLinkBtn(d).replace('text-xs', 'btn btn-ghost')}
                </div>`);
        }
        function toggleStep(id, i) { const t = findItem('tasks', id); if (!t || !t.subtasks[i]) return; t.subtasks[i].done = !t.subtasks[i].done; saveDB(); openTaskDetail(id); if (isInApp()) renderView(currentView); }
        function removeStep(id, i) { const t = findItem('tasks', id); if (!t) return; t.subtasks.splice(i, 1); saveDB(); openTaskDetail(id); }
        function addStep(id) {
            const v = val('step-new').trim(); if (!v) return;
            const t = findItem('tasks', id); if (!t) return;
            t.subtasks = t.subtasks || []; t.subtasks.push({ t: v.slice(0, 200), done: false }); saveDB();
            openTaskDetail(id); setTimeout(() => $('step-new') && $('step-new').focus(), 30);
        }
        let noteTimer = null;
        function saveTaskNote(id, v) { clearTimeout(noteTimer); noteTimer = setTimeout(() => { const t = findItem('tasks', id); if (t) { t.notes = v.slice(0, 2000); saveDB(); } }, 300); }

        // ---------------------------------------------------------------
        // EXÁMENES
        // ---------------------------------------------------------------
        function renderExamsView(container, title) {
            title.innerHTML = '<span class="text-red-700"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Horario de Exámenes</span>';
            const now = Date.now();
            const exams = DB.exams.map(e => ({ e, ...examTimes(e) })).sort((a, b) => a.start - b.start);
            const upcoming = exams.filter(x => x.end > now);
            const toolbar = `<div class="flex flex-wrap gap-2 mb-5 no-print">
                <button onclick="openExamEditor()" class="btn btn-brand"><i class="fa-solid fa-plus"></i>Agregar examen</button>
                <button onclick="openPeriodEditor()" class="btn btn-ghost"><i class="fa-solid fa-calendar-days"></i>Nuevo periodo de exámenes</button>
                <span class="flex-grow"></span>
                ${upcoming.length ? `<button onclick="exportExamsICS()" class="btn btn-ghost"><i class="fa-solid fa-calendar-plus"></i>Exportar (.ics)</button>` : ''}
            </div>`;
            if (!upcoming.length) {
                container.innerHTML = `${toolbar}
                    <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden mb-5"><div class="app-header-bg text-white p-4 text-center"><h3 class="text-xl font-bold">HORARIO DE EXÁMENES</h3></div></div>
                    <div class="surface-card rounded-xl shadow-md p-10 text-center">
                        <i class="fa-regular fa-calendar-xmark text-5xl text-gray-300 mb-4"></i>
                        <p class="text-lg font-bold text-gray-900">Exámenes vacíos o sin aviso previo</p>
                        <p class="text-sm text-gray-500 mt-1">Cuando Coordinación publique nuevas fechas, agrégalas aquí con “Agregar examen”.</p>
                    </div>
                    ${exams.length ? `<details class="mt-5"><summary class="cursor-pointer text-sm font-semibold text-gray-500">Exámenes anteriores (${exams.length})</summary><div class="space-y-2 mt-3">${exams.reverse().map(examRow).join('')}</div></details>` : ''}`;
                return;
            }
            const next = upcoming[0];
            const nextBlock = `
                <div class="surface-card rounded-xl shadow-md border-l-4 border-red-500 p-4 mb-5 flex items-center gap-4 flex-wrap">
                    <i class="fa-solid fa-bullseye text-red-500 text-3xl"></i>
                    <div class="flex-grow min-w-0">

        function nParciales() { return clamp(parseInt(P.parciales) || 3, 1, 6); }
        function gradeWeights() {
            const n = nParciales(), w = (P.weights || []).slice(0, n).map(Number);
            if (w.length === n && w.every(x => x > 0)) return w;
            return Array(n).fill(1);
        }
        function gradeStats(s) {
            const g = loadJSON(STORAGE_KEYS.grades, {});
            const row = g[s] || [], w = gradeWeights();
            let sum = 0, wsum = 0;
            w.forEach((wi, i) => { const v = parseFloat(row[i]); if (!isNaN(v)) { sum += v * wi; wsum += wi; } });
            return wsum ? { avg: sum / wsum, sum, wsum } : null;
        }

            const ex = DB.exams.map(e => ({ e, ...examTimes(e) })).filter(x => x.e.subject === s && x.end > now).sort((a, b) => a.start - b.start)[0];
            return { dl, pending: dl.filter(d => !d.completed), done: dl.filter(d => d.completed), mins, ab, grade: gradeStats(s), nextExam: ex };

        // ---------------------------------------------------------------
        // ESTUDIO: Pomodoro, tarjetas, cronómetro, ruido
        // ---------------------------------------------------------------
        let studyTab = 'pomo';
        const STUDY_TABS = [['pomo', 'Pomodoro', 'fa-stopwatch'], ['cards', 'Tarjetas', 'fa-layer-group'], ['watch', 'Cronómetro', 'fa-clock']];

                <div id="study-body" class="mt-5"></div>`;

        }

        // ---- Pomodoro ----
        const POMO_LABELS = { focus: 'Concentración', short: 'Descanso corto', long: 'Descanso largo' };
        let pomo = { mode: 'focus', remaining: (P.pomo.focus || 25) * 60, running: false, endAt: 0, cycle: 0, timer: null, startedAt: 0 };
        function pomoDur(mode) { const p = P.pomo; return clamp(parseInt(mode === 'focus' ? p.focus : mode === 'short' ? p.short : p.long) || 1, 1, 180) * 60; }
        function getPomoCount() { const v = loadJSON(STORAGE_KEYS.pomoDay, null); return v && v.date === todayKey() ? v.n : 0; }
        function addPomoCount(min) {
            saveJSON(STORAGE_KEYS.pomoDay, { date: todayKey(), n: getPomoCount() + 1 });
            const log = loadJSON(STORAGE_KEYS.pomoLog, []);
            log.push({ date: todayKey(), min, subject: P.pomo.subject || '' });
            saveJSON(STORAGE_KEYS.pomoLog, log.slice(-1500));
            logActivity();
        }
        let wakeLock = null;
        async function keepAwake(on) {
            try {
                if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
                if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
            } catch (e) { /* no soportado */ }
        }
        function pomoStart() { if (pomo.running) return; getAudio(); pomo.endAt = Date.now() + pomo.remaining * 1000; pomo.running = true; pomo.timer = setInterval(pomoTick, 250); keepAwake(true); pomoUpdateUI(); }
        function pomoPause() { if (!pomo.running) return; pomoTick(); clearInterval(pomo.timer); pomo.running = false; keepAwake(false); pomoUpdateUI(); }
        function pomoToggle() { pomo.running ? pomoPause() : pomoStart(); }
        function pomoReset() { clearInterval(pomo.timer); pomo.running = false; keepAwake(false); pomo.remaining = pomoDur(pomo.mode); pomoUpdateUI(); }
        function pomoSkip() { pomoNext(false); }
        function pomoSetPreset(f, s, l) { Object.assign(P.pomo, { focus: f, short: s, long: l }); savePrefs(); pomo.cycle = 0; pomo.mode = 'focus'; pomoReset(); renderView('study'); }
        function pomoSetCustom() {
            const f = clamp(parseInt(val('pomo-f')) || 25, 1, 180), s = clamp(parseInt(val('pomo-s')) || 5, 1, 60), l = clamp(parseInt(val('pomo-l')) || 15, 1, 90);

        }
        function pomoTick() {
            if (!pomo.running) return;
