<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mi Horario Escolar</title>
    <meta name="description" content="Horario de clases, exámenes y entregas de Moodle y ALEKS con cuenta regresiva, alertas y herramientas de estudio.">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Horario">
    <link rel="manifest" href="mi-horario.webmanifest">
    <link rel="icon" id="favicon" type="image/svg+xml" href="mi-horario-icon.svg">
    <link rel="apple-touch-icon" href="mi-horario-icon-192.png">
    <!-- Aplica modo oscuro/claro y tamaño de letra antes de pintar para evitar parpadeos -->
    <script>
        try {
            var m = localStorage.getItem('schedule_mode') || 'auto';
            var dk = m === 'dark' || m === 'amoled' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dk) document.documentElement.classList.add('dark');
            if (m === 'amoled') document.documentElement.classList.add('amoled');
            var pf = JSON.parse(localStorage.getItem('schedule_prefs') || '{}');
            if (pf.fontSize) document.documentElement.style.fontSize = pf.fontSize + 'px';
            if (pf.compact) document.documentElement.classList.add('compact');
            if (pf.reduceMotion) document.documentElement.classList.add('reduce-motion');
        } catch (e) {}
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        uca: { dark: '#1e3a8a', light: '#3b82f6', accent: '#f97316', bg: '#f3f4f6' }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --brand-dark: #1e3a8a;
            --brand-light: #3b82f6;
            --brand-deep: #172554;
            --brand-bg: #f3f4f6;
            --surface: #ffffff;
            --surface-2: #f9fafb;
            --text: #374151;
            --text-strong: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --ok: #16a34a; --warn: #d97706; --danger: #dc2626;
            --safe-b: env(safe-area-inset-bottom, 0px);
        }
        html.dark {
            --brand-bg: #0a0f1e;
            --surface: #141b2d;
            --surface-2: #1a2238;
            --text: #d1d5db;
            --text-strong: #f9fafb;
            --muted: #9ca3af;
            --border: #27324d;
            --ok: #4ade80; --warn: #fbbf24; --danger: #f87171;
            color-scheme: dark;
        }
        html.dark.amoled { --brand-bg: #000000; --surface: #0b0b0f; --surface-2: #121218; --border: #23232d; }
        html.compact .p-6 { padding: 1rem !important; }
        html.compact .p-5 { padding: .85rem !important; }
        html.compact .p-4 { padding: .7rem !important; }
        html.compact .gap-6 { gap: 1rem !important; }
        html.compact .mb-6 { margin-bottom: 1rem !important; }
        html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after { animation: none !important; transition: none !important; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

        body { transition: background-color .25s ease, color .25s ease; -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid var(--brand-light); outline-offset: 2px; }

        .app-header-bg { background: linear-gradient(90deg, var(--brand-dark), var(--brand-deep)); }
        .entry-bg { background: linear-gradient(145deg, var(--brand-dark) 0%, var(--brand-deep) 100%); }
        .surface-card { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        .surface-2 { background: var(--surface-2); }
        .strong { color: var(--text-strong); }
        .muted { color: var(--muted); }
        .brand-text { color: var(--brand-light); }
        .hairline { border-color: var(--border) !important; }
        .field {
            background: var(--surface-2); color: var(--text-strong); border: 1px solid var(--border);
            border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; outline: none; min-width: 0;
        }
        .field:focus { box-shadow: 0 0 0 2px var(--brand-light); }
        textarea.field { resize: vertical; }
        .lbl { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin-bottom: .25rem; }
        .btn-brand { background: var(--brand-dark); color: #fff; }
        .btn-brand:hover { opacity: .9; }
        .btn-ghost { background: var(--surface-2); color: var(--text-strong); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--brand-light); }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover { background: #b91c1c; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; font-size: .85rem; font-weight: 600;
            padding: .5rem .9rem; border-radius: .6rem; white-space: nowrap; transition: opacity .15s, border-color .15s; }
        .btn-sm { font-size: .75rem; padding: .35rem .65rem; border-radius: .5rem; }
        .icon-act { width: 2rem; height: 2rem; border-radius: .5rem; display: inline-flex; align-items: center; justify-content: center;
            color: var(--muted); transition: background .15s, color .15s; flex-shrink: 0; }
        .icon-act:hover { background: var(--surface-2); color: var(--text-strong); }
        .icon-act.on { color: #f59e0b; }

        /* ---------- Overrides del modo oscuro para las clases Tailwind ya usadas ---------- */
        html.dark .bg-white { background-color: var(--surface) !important; }
        html.dark .bg-gray-50, html.dark .bg-gray-100 { background-color: var(--surface-2) !important; }
        html.dark .text-gray-900, html.dark .text-gray-800 { color: var(--text-strong) !important; }
        html.dark .text-gray-700, html.dark .text-gray-600 { color: var(--text) !important; }
        html.dark .text-gray-500, html.dark .text-gray-400 { color: var(--muted) !important; }
        html.dark .text-gray-300 { color: #4b5563 !important; }
        html.dark .border-gray-100, html.dark .border-gray-200, html.dark .border-gray-300 { border-color: var(--border) !important; }
        html.dark .divide-gray-100 > * + * { border-color: var(--border) !important; }
        html.dark .bg-blue-50 { background-color: rgba(59,130,246,.12) !important; }
        html.dark .text-blue-700, html.dark .text-blue-800 { color: #93c5fd !important; }
        html.dark .bg-amber-50 { background-color: rgba(245,158,11,.12) !important; }
        html.dark .text-amber-800, html.dark .text-amber-700 { color: #fcd34d !important; }
        html.dark .bg-amber-100 { background-color: rgba(245,158,11,.18) !important; }
        html.dark .bg-emerald-50 { background-color: rgba(16,185,129,.12) !important; }
        html.dark .bg-emerald-100 { background-color: rgba(16,185,129,.18) !important; }
        html.dark .text-emerald-700, html.dark .text-emerald-800 { color: #6ee7b7 !important; }
        html.dark .bg-red-50 { background-color: rgba(239,68,68,.12) !important; }
        html.dark .bg-red-100 { background-color: rgba(239,68,68,.18) !important; }
        html.dark .text-red-700, html.dark .text-red-800 { color: #fca5a5 !important; }
        html.dark .bg-orange-100 { background-color: rgba(249,115,22,.18) !important; }
        html.dark .text-orange-700 { color: #fdba74 !important; }
        html.dark .bg-purple-50 { background-color: rgba(168,85,247,.12) !important; }
        html.dark .text-purple-700, html.dark .text-purple-800 { color: #c4b5fd !important; }
        html.dark .bg-sky-50 { background-color: rgba(14,165,233,.12) !important; }
        html.dark .text-sky-700, html.dark .text-sky-800 { color: #7dd3fc !important; }
        html.dark ::-webkit-scrollbar-track { background: #0f1629; }
        html.dark ::-webkit-scrollbar-thumb { background: #33415f; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        #main-nav::-webkit-scrollbar, .no-scrollbar::-webkit-scrollbar { height: 0; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseSoft { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
        @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }

        /* ---------- Navegación ---------- */
        .nav-btn {
            --acc: #ffffff;
            display: inline-flex; align-items: center; gap: .45rem; white-space: nowrap;
            padding: .5rem .85rem; border-radius: .6rem; font-size: .85rem; font-weight: 600;
            color: rgba(255,255,255,.78); transition: background .15s, color .15s; position: relative;
        }
        .nav-btn i { color: var(--acc); }
        .nav-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
        .nav-btn.active { background: rgba(255,255,255,.2); color: #fff; box-shadow: inset 0 -2px 0 var(--acc); }
        [data-accent="amber"]   { --acc: #fbbf24; }
        [data-accent="purple"]  { --acc: #c4b5fd; }
        [data-accent="emerald"] { --acc: #6ee7b7; }
        [data-accent="red"]     { --acc: #fca5a5; }
        [data-accent="sky"]     { --acc: #7dd3fc; }
        [data-accent="pink"]    { --acc: #f9a8d4; }
        [data-accent="lime"]    { --acc: #bef264; }
        .nav-badge {
            background: #ef4444; color: #fff; font-size: .65rem; font-weight: 800; min-width: 1.1rem; height: 1.1rem;
            border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; padding: 0 .3rem;
        }
        .icon-btn {
            width: 2.25rem; height: 2.25rem; border-radius: 999px; background: rgba(255,255,255,.12);
            display: inline-flex; align-items: center; justify-content: center; color: #fff; transition: background .15s; flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(255,255,255,.25); }

        /* Barra inferior (móvil) */
        #bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--surface); border-top: 1px solid var(--border);
            padding-bottom: var(--safe-b); box-shadow: 0 -6px 20px rgba(0,0,0,.08); }
        .bn-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .5rem 0 .45rem; font-size: .65rem;
            font-weight: 600; color: var(--muted); position: relative; }
        .bn-btn i { font-size: 1.1rem; }
        .bn-btn.active { color: var(--brand-light); }
        .bn-btn.active::before { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand-light); }
        .bn-btn .nav-badge { position: absolute; top: .25rem; left: 55%; }
        @media (max-width: 767px) { body.in-app { padding-bottom: calc(4rem + var(--safe-b)); } }

        /* ---------- Cuenta regresiva ---------- */
        .cd-chip {
            display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .65rem; border-radius: 999px;
            font-size: .75rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .cd-ok   { background: #dcfce7; color: #166534; }
        .cd-warn { background: #fef3c7; color: #92400e; }
        .cd-hot  { background: #ffedd5; color: #9a3412; }
        .cd-crit { background: #fee2e2; color: #991b1b; animation: pulseSoft 1.4s infinite; }
        .cd-over { background: #991b1b; color: #fff; }
        .cd-done { background: #d1fae5; color: #065f46; }
        .cd-soon { background: #e0e7ff; color: #3730a3; }
        html.dark .cd-ok   { background: rgba(34,197,94,.18);  color: #86efac; }
        html.dark .cd-warn { background: rgba(245,158,11,.2);  color: #fcd34d; }
        html.dark .cd-hot  { background: rgba(249,115,22,.22); color: #fdba74; }
        html.dark .cd-crit { background: rgba(239,68,68,.25);  color: #fca5a5; }
        html.dark .cd-done { background: rgba(16,185,129,.2);  color: #6ee7b7; }
        html.dark .cd-soon { background: rgba(99,102,241,.25); color: #c7d2fe; }
        .bar-track { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
        .pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .7rem; font-weight: 700; padding: .15rem .5rem; border-radius: 999px; white-space: nowrap; }
        .pill-moodle { background: #f3e8ff; color: #6b21a8; } html.dark .pill-moodle { background: rgba(168,85,247,.2); color: #d8b4fe; }
        .pill-aleks { background: #d1fae5; color: #065f46; } html.dark .pill-aleks { background: rgba(16,185,129,.2); color: #6ee7b7; }
        .pill-otra { background: #e0f2fe; color: #075985; } html.dark .pill-otra { background: rgba(14,165,233,.2); color: #7dd3fc; }
        .pill-exam { background: #fee2e2; color: #991b1b; } html.dark .pill-exam { background: rgba(239,68,68,.2); color: #fca5a5; }
        .pill-soft { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

        /* ---------- Toasts ---------- */
        #toast-wrap { position: fixed; bottom: calc(1rem + var(--safe-b)); left: 50%; transform: translateX(-50%); width: min(92vw, 26rem);
            z-index: 400; display: flex; flex-direction: column; gap: .5rem; pointer-events: none; }
        body.in-app #toast-wrap { bottom: calc(5rem + var(--safe-b)); }
        @media (min-width: 768px) { body.in-app #toast-wrap { bottom: 1rem; } }
        .toast { pointer-events: auto; background: #111827; color: #fff; border-left: 4px solid var(--brand-light);
            padding: .75rem 1rem; border-radius: .75rem; box-shadow: 0 10px 30px rgba(0,0,0,.35);
            display: flex; gap: .75rem; align-items: flex-start; font-size: .85rem; animation: fadeIn .25s ease; }
        .toast span { flex: 1; }
        .toast button { opacity: .6; }
        .toast button:hover { opacity: 1; }
        .toast .toast-act { opacity: 1; font-weight: 800; color: #93c5fd; text-transform: uppercase; font-size: .75rem; letter-spacing: .03em; }
        .toast-warn { border-color: #f59e0b; }
        .toast-danger { border-color: #ef4444; }
        .toast-ok { border-color: #22c55e; }

        /* ---------- Chips ---------- */
        .tool-chip { padding: .45rem .9rem; border-radius: 999px; font-size: .8rem; font-weight: 600; white-space: nowrap;
            background: var(--surface); border: 1px solid var(--border); color: var(--text); transition: all .15s; }
        .tool-chip:hover { border-color: var(--brand-light); }
        .tool-chip.active { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }

        /* ---------- Modal genérico ---------- */
        .modal-back { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .modal-box { width: 100%; max-width: 32rem; max-height: 92vh; overflow-y: auto; border-radius: 1rem; animation: fadeIn .2s ease; }
        @media (max-width: 639px) {
            .modal-back.sheet { align-items: flex-end; padding: 0; }
            .modal-back.sheet .modal-box { border-radius: 1.25rem 1.25rem 0 0; max-height: 88vh; padding-bottom: calc(1.25rem + var(--safe-b)); }
        }
        .swatch { width: 2rem; height: 2rem; border-radius: 999px; border: 3px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .swatch.sel { border-color: var(--text-strong); transform: scale(1.1); }

        /* ---------- Riel del día ---------- */
        .rail { position: relative; margin-left: 3rem; }
        .rail-hour { position: absolute; left: -3rem; right: 0; border-top: 1px dashed var(--border); }
        .rail-hour span { position: absolute; top: -.55rem; left: 0; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--brand-bg); padding-right: .3rem; }
        .rail-block { position: absolute; left: 0; right: 0; border-radius: .6rem; color: #fff; padding: .45rem .7rem; text-align: left; overflow: hidden;
            display: flex; flex-direction: column; gap: .1rem; box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: transform .15s, opacity .15s; }
        .rail-block:hover { transform: translateX(2px); }
        .rail-block.is-past { opacity: .5; }
        .rail-block.is-now { box-shadow: 0 0 0 3px var(--brand-bg), 0 0 0 5px var(--brand-light); }
        .rail-block .rt { font-size: .7rem; font-weight: 700; opacity: .9; }
        .rail-block .rs { font-weight: 700; line-height: 1.15; font-size: .95rem; }
        .rail-block .rr { font-size: .7rem; opacity: .9; }
        .rail-recess { position: absolute; left: 0; right: 0; border-radius: .6rem; background: repeating-linear-gradient(45deg, rgba(245,158,11,.16), rgba(245,158,11,.16) 8px, rgba(245,158,11,.08) 8px, rgba(245,158,11,.08) 16px);
            border: 1px dashed #f59e0b; color: #b45309; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 2; }
        html.dark .rail-recess { color: #fcd34d; }
        .rail-now { position: absolute; left: -.4rem; right: 0; height: 2px; background: #ef4444; z-index: 5; pointer-events: none; }
        .rail-now::before { content: ''; position: absolute; left: -.3rem; top: -.3rem; width: .6rem; height: .6rem; border-radius: 999px; background: #ef4444; }
        .rail-now span { position: absolute; right: 0; top: -1.1rem; font-size: .65rem; font-weight: 800; color: #fff; background: #ef4444; border-radius: .3rem; padding: 0 .3rem; }

        /* ---------- Semana proporcional ---------- */
        .wk { display: grid; grid-template-columns: 3rem repeat(var(--cols), minmax(0,1fr)); gap: .4rem; }
        .wk-head { text-align: center; font-weight: 700; font-size: .8rem; padding: .5rem 0; border-radius: .5rem; color: #fff; }
        .wk-col { position: relative; height: var(--h); border-radius: .5rem; background: var(--surface); border: 1px solid var(--border); }
        .wk-col.today { box-shadow: 0 0 0 2px var(--brand-light); }
        .wk-axis { position: relative; height: var(--h); }
        .wk-axis span { position: absolute; right: .3rem; transform: translateY(-50%); font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .wk-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
        .wk-block { position: absolute; left: 3px; right: 3px; border-radius: .45rem; color: #fff; padding: .3rem .45rem; text-align: left; overflow: hidden; font-size: .75rem; line-height: 1.15; }
        .wk-block:hover { filter: brightness(1.08); }
        .wk-block b { display: block; font-size: .78rem; }
        .wk-recess { position: absolute; left: 0; right: 0; background: rgba(245,158,11,.14); border-top: 1px dashed #f59e0b; border-bottom: 1px dashed #f59e0b; }
        .wk-now { position: absolute; left: 0; right: 0; height: 2px; background: #ef4444; z-index: 3; }

        /* ---------- Calendario mensual ---------- */
        .cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: .3rem; }
        .cal-dow { text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; padding: .25rem 0; }
        .cal-day { min-height: 4.2rem; border-radius: .6rem; background: var(--surface); border: 1px solid var(--border); padding: .3rem .35rem; text-align: left; position: relative; display: flex; flex-direction: column; gap: .2rem; }
        .cal-day.out { opacity: .4; }
        .cal-day.today { box-shadow: 0 0 0 2px var(--brand-light); }
        .cal-day.sel { background: var(--surface-2); box-shadow: 0 0 0 2px var(--brand-dark); }
        .cal-day .num { font-size: .8rem; font-weight: 700; color: var(--text-strong); }
        .cal-dots { display: flex; flex-wrap: wrap; gap: 2px; }
        .cal-dots i { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
        .cal-tag { font-size: .6rem; font-weight: 700; border-radius: .25rem; padding: 0 .2rem; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        @media (max-width: 639px) { .cal-day { min-height: 3.2rem; } .cal-tag { display: none; } }

        /* ---------- Pomodoro ---------- */
        .pomo-ring { --p: 0; width: 15rem; height: 15rem; border-radius: 999px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
            background: conic-gradient(var(--brand-light) calc(var(--p) * 360deg), var(--border) 0); transition: background .3s; }
        .pomo-inner { width: 13.2rem; height: 13.2rem; border-radius: 999px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* ---------- Tarjetas de estudio ---------- */
        .flip { perspective: 1000px; }
        .flip-in { position: relative; min-height: 13rem; transition: transform .5s; transform-style: preserve-3d; }
        .flip.flipped .flip-in { transform: rotateY(180deg); }
        .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 1rem; display: flex; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; font-size: 1.15rem; font-weight: 600; }
        .flip-back { transform: rotateY(180deg); }

        /* ---------- Modo enfoque / bloqueo ---------- */
        #focus-overlay, #lock-screen { position: fixed; inset: 0; z-index: 500; }

        .pin-dot { width: .9rem; height: .9rem; border-radius: 999px; border: 2px solid #fff; }
        .pin-dot.on { background: #fff; }
        .pin-key { width: 4.2rem; height: 4.2rem; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font-size: 1.4rem; font-weight: 700; }
        .pin-key:active { background: rgba(255,255,255,.3); }
        .shake { animation: shake .4s; }
        @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

        .cmd-item { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .6rem .8rem; border-radius: .6rem; text-align: left; font-size: .9rem; color: var(--text-strong); }

        .badge-ach { width: 3.4rem; height: 3.4rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .ach-locked { filter: grayscale(1); opacity: .35; }
        .sec-title { font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
        .switch { position: relative; width: 2.6rem; height: 1.5rem; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch span { position: absolute; inset: 0; background: var(--border); border-radius: 999px; transition: background .2s; cursor: pointer; }
        .switch span::before { content: ''; position: absolute; width: 1.1rem; height: 1.1rem; left: .2rem; top: .2rem; background: #fff; border-radius: 999px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
        .switch input:checked + span { background: var(--brand-light); }
        .switch input:checked + span::before { transform: translateX(1.1rem); }
        .stat-big { font-size: 1.9rem; font-weight: 800; color: var(--text-strong); font-variant-numeric: tabular-nums; line-height: 1.1; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 450; }

        // ---------------------------------------------------------------

        // =================================================================

        const SEED = { classes: SEED_CLASSES, exams: SEED_EXAMS, tasks: SEED_TASKS, examPeriods: SEED_PERIODS };
        const SEED_FIELDS = {

        // Limpia un elemento importado (de un respaldo o enlace de sincronización)
        function cleanItem(col, it) {

        function cleanDB(raw) {
            const db = { classes: [], exams: [], tasks: [], examPeriods: [], holidays: [], subjects: {}, deleted: [] };
            if (!raw || typeof raw !== 'object') return db;
            Object.keys(SEED_FIELDS).forEach(col => { db[col] = (Array.isArray(raw[col]) ? raw[col] : []).map(it => cleanItem(col, it)).filter(Boolean); });
            db.holidays = (Array.isArray(raw.holidays) ? raw.holidays : []).filter(h => h && DATE_RE.test(h.date)).map(h => ({ date: h.date, label: str(h.label, 80) }));

        // Une la semilla del archivo con lo guardado: llegan materias/tareas nuevas y se respetan tus ediciones

                const ids = new Set(SEED[col].map(s => s.id));

                    const sig = seedSig(s, fields);

        // El navegador solo permite sonido/vibración después de que tocas la página
        const userActive = () => !navigator.userActivation || navigator.userActivation.hasBeenActive;
        function beep(times = 2, freq = 880) {
            if (!soundEnabled() || !userActive()) return;
            try {
                const ctx = getAudio(); if (!ctx) return;
                for (let i = 0; i < times; i++) {
                    const o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'sine'; o.frequency.value = freq;
                    o.connect(g); g.connect(ctx.destination);
                    const t0 = ctx.currentTime + i * 0.25;
                    g.gain.setValueAtTime(0.0001, t0);
                    g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
                    o.start(t0); o.stop(t0 + 0.2);
                }
            } catch (e) { /* audio no disponible hasta que haya interacción */ }
        }
        function vibrate(pattern = [200, 100, 200]) { if (P.vibrate && !inQuietHours() && navigator.vibrate && userActive()) try { navigator.vibrate(pattern); } catch (e) {} }

        function notifSupported() { return 'Notification' in window; }
        function notifGranted() { return notifSupported() && Notification.permission === 'granted' && loadSetting(STORAGE_KEYS.notifOn, '0') === '1'; }
        let swReg = null;
        function sendNotification(title, body, tag) {
            if (!notifGranted()) return;
            const opts = { body, tag, icon: 'mi-horario-icon-192.png', badge: 'mi-horario-icon-192.png', silent: inQuietHours() };
            // En Android las notificaciones solo funcionan a través del service worker
            if (swReg && swReg.showNotification) { swReg.showNotification(title, opts).catch(() => {}); return; }
            try { new Notification(title, opts); } catch (e) { /* algunos móviles no lo permiten sin service worker */ }
        }
        function requestNotifPermission() {
            if (!notifSupported()) { showToast('Tu navegador no soporta notificaciones. Las alertas saldrán dentro de la página.', 'warn'); return; }
            if (Notification.permission === 'denied') { showToast('Las notificaciones están bloqueadas. Actívalas en los permisos del sitio de tu navegador.', 'warn', 9000); return; }
            Notification.requestPermission().then(p => {
                if (p === 'granted') {
                    saveSetting(STORAGE_KEYS.notifOn, '1');
                    showToast('¡Listo! Te avisaremos antes de cada entrega mientras la app esté abierta.', 'ok');
                    sendNotification('Mi Horario', 'Las alertas están activadas ✅', 'test');
                } else {
                    showToast('No se activaron las notificaciones.', 'warn');
                }
                if (isInApp() && ['tasks', 'settings'].includes(currentView)) renderView(currentView);
            });
        }
        function notifStatusText() {
            if (!notifSupported()) return ['No disponible en este navegador', null];
            if (Notification.permission === 'granted' && loadSetting(STORAGE_KEYS.notifOn, '0') === '1') return ['Activadas ✅', 'test'];
            if (Notification.permission === 'denied') return ['Bloqueadas en el navegador', 'help'];
            return ['Desactivadas', 'on'];
        }

        // ---------------------------------------------------------------

        let modalOnClose = null;
        function openModal(inner, { wide = false, sheet = true, onClose = null } = {}) {

        function closeModal() {

        function modalHead(title, icon = '') {

        function sanitizeUrl(u) {
            u = (u || '').trim();
            if (!u) return '';
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            try { const p = new URL(u); return (p.protocol === 'http:' || p.protocol === 'https:') && p.hostname.includes('.') ? p.href : ''; } catch (e) { return ''; }
        }

        // =================================================================
        // HORARIO: qué toca cada día
        // =================================================================
        function examPeriodFor(dt) { const k = dateKey(dt); return DB.examPeriods.find(p => k >= p.start && k <= p.end) || null; }
        function holidayFor(dt) { const k = dateKey(dt); return DB.holidays.find(h => h.date === k) || null; }
        function examsOn(dt) { const k = dateKey(dt); return DB.exams.filter(e => e.date === k).sort((a, b) => toMin(a.start) - toMin(b.start)); }
        const asItem = (x, isExam) => ({ id: x.id, subject: x.subject, start: x.start, end: x.end, startMin: toMin(x.start), endMin: toMin(x.end), room: x.room, color: x.color, isExam, ref: x });

        // Horario efectivo de una fecha: exámenes en periodo de exámenes, nada en festivos, clases normales el resto
        function itemsForDate(dt) {
            if (holidayFor(dt)) return [];
            const exams = examsOn(dt).map(e => asItem(e, true));
            if (examPeriodFor(dt)) return exams;
            const classes = DB.classes.filter(c => c.day === dt.getDay()).map(c => asItem(c, false));
            return [...classes, ...exams].sort((a, b) => a.startMin - b.startMin);
        }
        function recessFor(dt) {
            const r = P.recess;
            if (!r || !r.on || examPeriodFor(dt) || holidayFor(dt)) return null;
            if (!DB.classes.some(c => c.day === dt.getDay())) return null;
            return { start: r.start, end: r.end, startMin: toMin(r.start), endMin: toMin(r.end) };
        }
        function nextItemAfter(now = new Date()) {
            for (let off = 0; off <= 21; off++) {
                const day = addDays(now, off);
                for (const it of itemsForDate(day)) {
                    const at = atTime(day, it.start);
                    if (at > now) return { item: it, at, day, sameDay: off === 0, offsetDays: off };
                }
            }
            return null;
        }
        // Qué debería estar haciendo el alumno ahorita
        function getScheduleStatus(now = new Date()) {
            const items = itemsForDate(now), nm = nowMinutes(now), next = nextItemAfter(now), wd = now.getDay();
            const hol = holidayFor(now);
            if (hol) return { state: 'holiday', holiday: hol, next };
            if (!items.length) return { state: (wd === 0 || wd === 6) ? 'weekend' : 'no_classes_today', next, exam: !!examPeriodFor(now) };
            const r = recessFor(now);
            if (r && nm >= r.startMin && nm < r.endMin) return { state: 'recess', recess: r, next };
            const cur = items.find(i => nm >= i.startMin && nm < i.endMin);
            if (cur) return { state: 'class', current: cur, next };
            if (nm < items[0].startMin) return { state: 'before', items, next };
            if (nm >= Math.max(...items.map(i => i.endMin))) return { state: 'after_school', next, exam: items.some(i => i.isExam) };
            return { state: 'gap', next };
        }
        function nextClassLabel(next) {
            if (!next) return null;
            const dayLabel = next.sameDay ? 'hoy' : (next.offsetDays === 1 ? 'mañana' : daysOfWeek[next.day.getDay()]);
            return `${next.item.isExam ? '📝 ' : ''}${esc(next.item.subject)} — ${dayLabel} a las ${next.item.start}${next.item.room ? ` · Aula ${esc(next.item.room)}` : ''}`;
        }
        function schoolDayProgress(now = new Date()) {
            const items = itemsForDate(now);
            if (!items.length) return null;
            const s = Math.min(...items.map(i => i.startMin)), e = Math.max(...items.map(i => i.endMin)), nm = nowMinutes(now);
            return { pct: clamp((nm - s) / (e - s) * 100, 0, 100), start: s, end: e };
        }

        function updateDates() {
            const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const s = new Date().toLocaleDateString('es-MX', opts);
            const a = $('current-date'); if (a) a.textContent = s;
            const b = $('entry-date'); if (b) b.textContent = s;
        }

        // =================================================================
        // ENTREGAS (Moodle + ALEKS + otras)
        // =================================================================
        function getDeadlines() {
            const done = new Set(loadCompletedTasks());
            const doneAt = loadJSON(STORAGE_KEYS.completedAt, {});
            const now = new Date();
            return DB.tasks.map(t => {
                const opens = parseLocal(t.opens), closes = parseLocal(t.due), fin = t.finalDue ? parseLocal(t.finalDue) : null;
                const inExtra = !!fin && now > closes;
                return { id: t.id, kind: t.kind, subject: t.subject, title: t.title, color: t.color, link: t.link, priority: t.priority || 0,
                    est: t.est || 0, myDay: t.myDay, subtasks: t.subtasks || [], notes: t.notes || '', task: t,
                    opens, closes, finalDue: fin, inExtra, due: inExtra ? fin : closes, completed: done.has(t.id), completedAt: doneAt[t.id] ? new Date(doneAt[t.id]) : null };
            }).filter(d => d.opens && d.due);
        }
        function getPendingDeadlines() {
            return getDeadlines().filter(d => !d.completed).sort((a, b) => a.due - b.due);
        }
        function toggleTaskCompleted(taskId) {
            const list = loadCompletedTasks();
            const idx = list.indexOf(taskId);
            const nowDone = idx === -1;
            const at = loadJSON(STORAGE_KEYS.completedAt, {});
            if (nowDone) { list.push(taskId); at[taskId] = new Date().toISOString(); } else { list.splice(idx, 1); delete at[taskId]; }
            saveCompletedTasks(list); saveJSON(STORAGE_KEYS.completedAt, at);
            if (nowDone) {
                logActivity();
                const left = getPendingDeadlines().filter(d => d.opens <= new Date()).length;
                showToast(left ? `¡Tarea completada! 🎉 Te quedan ${left} abiertas.` : '¡Tarea completada! 🎉 No te queda nada abierto.', 'ok', 3500, { label: 'Deshacer', fn: () => toggleTaskCompleted(taskId) });
                if (P.confetti) confetti();
                vibrate([60]);
                checkAchievements();
            }
            refreshAll();
        }
        const platformLabel = k => ({ moodle: 'Moodle', aleks: 'ALEKS', otra: 'Otra' }[k] || 'Otra');

        // ---------------------------------------------------------------
        // Cuenta regresiva
        // ---------------------------------------------------------------
        function levelFor(ms) {
            if (ms <= 0) return 'over';
            const h = ms / HOUR;
            if (h < 3) return 'crit';
            if (h < 24) return 'hot';
            if (h < 72) return 'warn';
            return 'ok';
        }
        function chipState(opensMs, dueMs) {
            const now = Date.now();
            if (now < opensMs) return { cls: 'cd-soon', html: `<i class="fa-regular fa-calendar-plus"></i> Abre en ${fmtDuration(opensMs - now)}` };
            const ms = dueMs - now;
            const lvl = levelFor(ms);
            if (lvl === 'over') return { cls: 'cd-over', html: `<i class="fa-solid fa-triangle-exclamation"></i> Venció hace ${fmtDuration(ms)}` };
            return { cls: 'cd-' + lvl, html: `<i class="fa-regular fa-hourglass-half"></i> Faltan ${fmtDuration(ms)}` };
        }
        function countdownChip(d) {
            if (d.completed) return `<span class="cd-chip cd-done"><i class="fa-solid fa-circle-check"></i> Completada</span>`;
            const st = chipState(d.opens.getTime(), d.due.getTime());
            return `<span class="cd-chip ${st.cls}" data-cd data-opens="${d.opens.getTime()}" data-due="${d.due.getTime()}">${st.html}</span>`;
        }
        function examChipState(startMs, endMs) {
            const now = Date.now();
            if (now >= endMs) return { cls: 'cd-done', html: '<i class="fa-solid fa-circle-check"></i> Realizado' };
            if (now >= startMs) return { cls: 'cd-crit', html: `<i class="fa-solid fa-pen"></i> En curso · termina en ${fmtDuration(endMs - now)}` };
            const ms = startMs - now;
            return { cls: 'cd-' + levelFor(ms), html: `<i class="fa-regular fa-hourglass-half"></i> Faltan ${fmtDuration(ms)}` };
        }
        function examTimes(e) { const day = fromKey(e.date); return { start: atTime(day, e.start), end: atTime(day, e.end), day }; }
        function examChip(e) {
            const t = examTimes(e);
            const st = examChipState(t.start.getTime(), t.end.getTime());
            return `<span class="cd-chip ${st.cls}" data-exam data-start="${t.start.getTime()}" data-end="${t.end.getTime()}">${st.html}</span>`;
        }
        function tickCountdowns() {
            document.querySelectorAll('[data-cd]').forEach(el => {
                const st = chipState(+el.dataset.opens, +el.dataset.due);
                el.className = 'cd-chip ' + st.cls;
                el.innerHTML = st.html;
            });
            document.querySelectorAll('[data-exam]').forEach(el => {
                const st = examChipState(+el.dataset.start, +el.dataset.end);
                el.className = 'cd-chip ' + st.cls;
                el.innerHTML = st.html;
            });
            document.querySelectorAll('[data-left]').forEach(el => {
                const ms = +el.dataset.left - Date.now();
                el.textContent = ms > 0 ? fmtDuration(ms) : '00:00:00';
            });
        }
        function progressBar(d) {
            if (d.completed) return `<div class="bar-track mt-3"><div class="bar-fill" style="width:100%;background:#10b981"></div></div>`;
            const now = Date.now(), o = d.opens.getTime(), du = d.due.getTime();
            if (now < o) return '';
            const pct = Math.max(0, Math.min(100, ((now - o) / (du - o)) * 100));
            const colors = { ok: '#22c55e', warn: '#f59e0b', hot: '#f97316', crit: '#ef4444', over: '#991b1b' };
            return `<div class="bar-track mt-3" title="Tiempo transcurrido del plazo"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${colors[levelFor(du - now)]}"></div></div>`;
        }

        // Barra de urgencia en el encabezado
        function updateUrgentBar() {
            const bar = $('urgent-bar');
            if (!bar || !isInApp()) return;
            const now = Date.now();
            const pending = getPendingDeadlines().filter(d => d.opens.getTime() <= now);
            const overdue = pending.filter(d => d.due.getTime() <= now);
            const upcoming = pending.filter(d => d.due.getTime() > now);
            const next = upcoming[0];
            const exam = DB.exams.map(e => ({ e, ...examTimes(e) })).filter(x => x.end > now).sort((a, b) => a.start - b.start)[0];
            let html = '', bg = '';
            if (exam && exam.start - now < 2 * HOUR) {
                bg = '#991b1b';
                html = exam.start <= now
                    ? `<i class="fa-solid fa-pen mr-2"></i>Examen en curso: <b>${esc(exam.e.subject)}</b> — termina en <b class="tabular-nums">${fmtDuration(exam.end - now)}</b>`
                    : `<i class="fa-solid fa-file-signature fa-shake mr-2"></i>Examen de <b>${esc(exam.e.subject)}</b> en <b class="tabular-nums">${fmtDuration(exam.start - now)}</b>`;
            } else if (next && (next.due.getTime() - now) < 72 * HOUR) {
                const lvl = levelFor(next.due.getTime() - now);
                bg = { warn: '#b45309', hot: '#c2410c', crit: '#b91c1c' }[lvl] || '#b45309';
                const t = next.title.length > 46 ? next.title.slice(0, 46) + '…' : next.title;
                html = `<i class="fa-solid fa-bell ${lvl === 'crit' ? 'fa-shake' : ''} mr-2"></i><b>${esc(next.kind === 'aleks' ? 'ALEKS' : next.subject)}</b> · ${esc(t)} — <b class="tabular-nums">${fmtDuration(next.due.getTime() - now)}</b>`;
            } else if (overdue.length) {
                bg = '#7f1d1d';
                html = `<i class="fa-solid fa-triangle-exclamation mr-2"></i>Tienes <b>${overdue.length}</b> tarea${overdue.length === 1 ? '' : 's'} vencida${overdue.length === 1 ? '' : 's'} sin marcar`;
            }
            if (!html) { bar.classList.add('hidden'); return; }
            bar.className = 'cursor-pointer text-white text-xs sm:text-sm font-semibold text-center px-4 py-1.5 truncate';
            bar.style.background = bg;
            bar.innerHTML = html;
        }
        function urgentCount() {
            const now = Date.now();
            return getPendingDeadlines().filter(d => d.opens.getTime() <= now && d.due.getTime() - now < 24 * HOUR).length;
        }
        function updateNavBadge() {
            const n = urgentCount();
            document.querySelectorAll('.badge-tasks').forEach(b => {
                if (n > 0) { b.textContent = n; b.classList.remove('hidden'); } else b.classList.add('hidden');
            });
            updateTabBadge(n);
        }
        // Número en el título de la pestaña y punto rojo en el ícono
        let lastFaviconN = -1;
        function updateTabBadge(n) {
            if (!(typeof pomo !== 'undefined' && pomo.running)) document.title = n > 0 ? `(${n}) Mi Horario Escolar` : 'Mi Horario Escolar';
            if (n === lastFaviconN) return;
            lastFaviconN = n;
            const t = themeColors(loadSetting(STORAGE_KEYS.theme, 'azul'));
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${t.dark}"/><path d="M32 14 6 26l26 12 20-9.2V42h4V26z" fill="#fff"/><path d="M16 33v9c0 4 7.2 8 16 8s16-4 16-8v-9l-16 7.4z" fill="#fff" opacity=".85"/>${n > 0 ? '<circle cx="50" cy="14" r="12" fill="#ef4444" stroke="#fff" stroke-width="3"/>' : ''}</svg>`;
            const link = $('favicon');
            if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        // ---------------------------------------------------------------
        // Alertas programadas (mientras la página esté abierta)
        // ---------------------------------------------------------------
        function stepLabel(min) { return min >= 1440 ? plural(Math.round(min / 1440), 'día', 'días') : min >= 60 ? plural(Math.round(min / 60), 'hora', 'horas') : plural(min, 'minuto', 'minutos'); }
        function fireAlert(key, title, body, type, notified) {
            if (notified[key]) return false;
            notified[key] = Date.now();
            showToast(`⏰ <b>${esc(title)}</b><br>${esc(body)}`, type, 12000);
            sendNotification(title, body, key);
            beep(type === 'danger' ? 3 : 2);
            vibrate();
            return true;
        }
        function checkAlerts() {
            const now = Date.now();
            const notified = loadJSON(STORAGE_KEYS.notified, {});
            let changed = false;
            const steps = [...P.alertSteps].map(Number).filter(n => n > 0).sort((a, b) => b - a);
            // Entregas
            getDeadlines().forEach(d => {
                if (d.completed || d.opens.getTime() > now) return;
                const rem = d.due.getTime() - now;
                if (rem <= 0) return;
                const crossed = steps.filter(s => rem <= s * MIN);
                if (!crossed.length) return;
                const smallest = crossed[crossed.length - 1];
                const base = d.id + ':' + d.due.getTime() + ':';
                if (notified[base + smallest * MIN]) return;
                crossed.forEach(s => { notified[base + s * MIN] = 1; });
                changed = true;
                const label = d.kind === 'aleks' ? `ALEKS · ${d.title}` : `${d.subject}: ${d.title}`;
                showToast(`⏰ <b>${esc(label)}</b><br>vence en menos de <b>${stepLabel(smallest)}</b>.`, smallest <= 60 ? 'danger' : 'warn', 12000);
                sendNotification(`Vence en menos de ${stepLabel(smallest)}`, label, d.id + smallest);
                beep(smallest <= 60 ? 3 : 2); vibrate();
            });
            // Exámenes: 1 día, 1 hora y 15 min antes
            if (P.examAlerts) DB.exams.forEach(e => {
                const t = examTimes(e), rem = t.start - now;
                if (rem <= 0) return;
                [[1440, 'warn', 'mañana'], [60, 'danger', 'en 1 hora'], [15, 'danger', 'en 15 minutos']].forEach(([m, type, when]) => {
                    if (rem <= m * MIN && rem > (m === 1440 ? 60 : m === 60 ? 15 : 0) * MIN)
                        changed = fireAlert(`exam:${e.id}:${t.start.getTime()}:${m}`, `📝 Examen ${when}`, `${e.subject} · ${e.start}${e.room ? ' · Aula ' + e.room : ''}`, type, notified) || changed;
                });
            });
            // Clases: X minutos antes (opcional)
            if (P.classAlert > 0) {
                const today = new Date();
                itemsForDate(today).filter(i => !i.isExam).forEach(i => {
                    const rem = atTime(today, i.start) - now;
                    if (rem > 0 && rem <= P.classAlert * MIN)
                        changed = fireAlert(`class:${todayKey()}:${i.id}`, `Clase en ${Math.ceil(rem / MIN)} min`, `${i.subject}${i.room ? ' · Aula ' + i.room : ''}`, 'info', notified) || changed;
                });
            }
            if (changed) {
                // Limpia avisos viejos para que no crezca sin fin
                const cutoff = now - 60 * DAY;
                Object.keys(notified).forEach(k => { if (typeof notified[k] === 'number' && notified[k] > 1 && notified[k] < cutoff) delete notified[k]; });
                saveJSON(STORAGE_KEYS.notified, notified);
            }
        }
        // Resumen del día la primera vez que abres la app cada día
        function dailySummary() {
            if (!P.dailySummary || loadSetting(STORAGE_KEYS.lastDay, '') === todayKey()) return;
            saveSetting(STORAGE_KEYS.lastDay, todayKey());
            const items = itemsForDate(new Date()), now = Date.now();
            const due24 = getPendingDeadlines().filter(d => d.opens <= now && d.due - now > 0 && d.due - now < 24 * HOUR).length;
            const exams = items.filter(i => i.isExam).length;
            const parts = [];
            if (exams) parts.push(plural(exams, 'examen', 'exámenes'));
            else if (items.length) parts.push(plural(items.length, 'clase', 'clases'));
            if (due24) parts.push(`${plural(due24, 'entrega', 'entregas')} en menos de 24 h`);
            const hol = holidayFor(new Date());
            const msg = hol ? `Hoy no hay clases: ${esc(hol.label)} 🎉` : parts.length ? `Hoy tienes ${parts.join(' y ')}.` : 'Hoy no tienes clases ni entregas urgentes. 😎';
            setTimeout(() => showToast(`☀️ <b>Resumen del día</b><br>${msg}`, 'info', 9000), 1200);
        }

        // ---------------------------------------------------------------
        // Clima (Open-Meteo, sin clave)
        // ---------------------------------------------------------------
        function weatherInfo(code) {
            if (code === 0) return ['☀️', 'Despejado'];
            if (code <= 2) return ['⛅', 'Parcialmente nublado'];
            if (code === 3) return ['☁️', 'Nublado'];
            if (code <= 48) return ['🌫️', 'Neblina'];
            if (code <= 57) return ['🌦️', 'Llovizna'];
            if (code <= 67) return ['🌧️', 'Lluvia'];
            if (code <= 77) return ['❄️', 'Nieve'];
            if (code <= 82) return ['🌧️', 'Chubascos'];
            if (code <= 86) return ['❄️', 'Nevada'];
            return ['⛈️', 'Tormenta'];
        }
        function getGeo() { return loadJSON(STORAGE_KEYS.geo, null) || DEFAULT_GEO; }
        function toggleGeo() {
            const saved = loadJSON(STORAGE_KEYS.geo, null);
            if (saved) { removeSetting(STORAGE_KEYS.geo); loadWeather(); return; }
            if (!navigator.geolocation) { showToast('Tu navegador no permite obtener la ubicación.', 'warn'); return; }
            navigator.geolocation.getCurrentPosition(pos => {
                saveJSON(STORAGE_KEYS.geo, { lat: pos.coords.latitude, lon: pos.coords.longitude, label: 'Mi ubicación' });
                loadWeather();
            }, () => showToast('No se pudo obtener tu ubicación.', 'warn'));
        }
        let weatherCache = null;
        async function loadWeather() {
            const box = $('weather-card');
            if (!box) return;
            const geo = getGeo();
            try {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), 7000);
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,weather_code,apparent_temperature&hourly=precipitation_probability,temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto&forecast_days=2`;
                const res = await fetch(url, { signal: ctrl.signal });
                clearTimeout(to);
                if (!res.ok) throw new Error('http ' + res.status);
                const data = await res.json();
                weatherCache = data;
                const [icon, desc] = weatherInfo(data.current.weather_code);
                const now = Date.now();
                let maxP = 0;
                const hours = [];
                data.hourly.time.forEach((t, i) => {
                    const ts = new Date(t).getTime();
                    if (ts >= now - HOUR && ts <= now + 6 * HOUR) maxP = Math.max(maxP, data.hourly.precipitation_probability[i] || 0);
                    if (ts >= now - HOUR && hours.length < 6 && ts % (2 * HOUR) < HOUR) hours.push({ h: new Date(t).getHours(), temp: data.hourly.temperature_2m[i], p: data.hourly.precipitation_probability[i] || 0, code: data.hourly.weather_code[i] });
                });
                const tmin = Math.round(data.daily.temperature_2m_min[0]), tmax = Math.round(data.daily.temperature_2m_max[0]), uv = data.daily.uv_index_max[0];
                const tips = [];
                if (maxP >= 50) tips.push('☔ Hay buena probabilidad de lluvia: lleva paraguas o chamarra.');
                if (tmin <= 10) tips.push('🧥 En la mañana hará frío: abrígate.');
                if (uv >= 8) tips.push('🧴 Índice UV muy alto: usa bloqueador y gorra.');
                if (tmax >= 30) tips.push('💧 Hará calor: lleva agua.');
                box.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-4xl leading-none">${icon}</span>
                        <div class="flex-grow min-w-0">
                            <p class="font-semibold">${Math.round(data.current.temperature_2m)}°C · ${desc} <span class="text-white/70 text-xs font-normal">(sensación ${Math.round(data.current.apparent_temperature)}°)</span></p>
                            <p class="text-xs text-white/75">${esc(geo.label)} · Mín ${tmin}° / Máx ${tmax}° · Lluvia próximas 6 h: <b>${maxP}%</b></p>
                        </div>
                        <button onclick="toggleGeo()" title="${loadJSON(STORAGE_KEYS.geo, null) ? 'Volver a ' + DEFAULT_GEO.label : 'Usar mi ubicación'}" class="icon-btn"><i class="fa-solid ${loadJSON(STORAGE_KEYS.geo, null) ? 'fa-rotate-left' : 'fa-location-crosshairs'} text-sm"></i></button>
                    </div>
                    ${hours.length ? `<div class="grid grid-cols-6 gap-1 mt-3 text-center text-[11px]">${hours.map(h => `<div class="bg-white/10 rounded-lg py-1"><p class="text-white/70">${pad(h.h)}h</p><p class="text-base leading-tight">${weatherInfo(h.code)[0]}</p><p class="font-semibold">${Math.round(h.temp)}°</p><p class="text-white/60">${h.p}%</p></div>`).join('')}</div>` : ''}
                    ${tips.map(t => `<p class="mt-2 text-sm font-semibold bg-white/15 rounded-lg px-3 py-1.5">${t}</p>`).join('')}`;
                box.classList.remove('hidden');
            } catch (e) {
                box.classList.add('hidden'); // sin conexión o API caída: no estorba
            }
        }

        function dailyQuote() { const d = new Date(); const n = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate(); return QUOTES[n % QUOTES.length]; }

            } else if (status.state === 'weekend') {
                mainBlock = `
                    <i class="fa-solid fa-couch text-4xl text-purple-500 mb-3"></i>

                    <h2 class="text-2xl font-bold text-gray-900 mt-1">${esc(status.holiday.label || 'Descanso')}</h2>`;
            } else {
                mainBlock = `
                    <i class="fa-solid fa-calendar-day text-4xl text-gray-400 mb-3"></i>
                    <h2 class="text-2xl font-bold text-gray-900 mt-1">${status.exam ? 'Hoy no tienes examen' : 'Sin clases hoy'}</h2>`;
            }
            const dayBar = prog && prog.pct > 0 && prog.pct < 100 && status.state !== 'class'
                ? `<div class="mt-4"><div class="bar-track"><div class="bar-fill" style="width:${prog.pct.toFixed(1)}%;background:var(--brand-light)"></div></div><p class="text-[11px] text-gray-400 mt-1">Llevas ${Math.round(prog.pct)}% del día escolar</p></div>` : '';
            card.innerHTML = mainBlock + dayBar + nextInfo;

            // ---- Recordatorio de pendientes con cuenta regresiva ----

            } else {

        function isInApp() { return !$('app-header').classList.contains('hidden'); }

        // =================================================================

        function buildNav() {
            $('main-nav').innerHTML = VIEWS.filter(v => v.nav !== false).map(v => `

        function openMoreSheet() {
