<!DOCTYPE html>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        uca: {
                            dark: '#1e3a8a', // Dark blue from the screenshots
                            light: '#3b82f6',
                            accent: '#f97316', // Orange accent for exams or current day
                            bg: '#f3f4f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --brand-dark: #1e3a8a;
            --brand-light: #3b82f6;
            --brand-bg: #f3f4f6;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

</head>
<body class="bg-[var(--brand-bg)] text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Entry / Status Screen -->
    <div id="entry-screen" class="min-h-screen w-full flex flex-col items-center justify-center px-4 py-10 bg-gradient-to-br from-[var(--brand-dark)] to-blue-950 relative">
        <button onclick="openSettings()" title="Personalizar" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors text-white">
            <i class="fa-solid fa-gear"></i>
        </button>
        <div class="w-full max-w-lg">
            <div class="text-center mb-6">
                <i class="fa-solid fa-graduation-cap text-4xl text-white mb-2"></i>
                <p class="text-blue-200 text-sm font-medium" id="entry-greeting"></p>
                <p class="text-blue-200 text-sm font-medium" id="entry-date"></p>
            </div>

            <div id="entry-card" class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 text-center">
                <!-- Filled dynamically by JS -->
                <p class="text-gray-400">Calculando tu horario...</p>
            </div>

            <!-- Pending Moodle tasks reminder -->
            <div id="tasks-reminder" class="hidden mt-4 bg-white/95 rounded-xl shadow-lg p-4 flex items-center gap-3 cursor-pointer hover:bg-white transition-colors" onclick="enterApp(false); changeView('moodle');">
                <!-- Filled dynamically by JS -->
            </div>

            <div class="flex flex-col sm:flex-row gap-3 mt-6">
                <button onclick="enterApp(true)" id="btn-go-current" class="flex-1 bg-white text-[var(--brand-dark)] font-semibold py-3 px-4 rounded-xl shadow-md hover:bg-blue-50 transition-colors flex items-center justify-center gap-2">
                    <i class="fa-solid fa-location-arrow"></i> Ir a mi clase actual
                </button>
                <button onclick="enterApp(false)" id="btn-go-menu" class="flex-1 bg-blue-800/60 text-white font-semibold py-3 px-4 rounded-xl shadow-md hover:bg-blue-800 transition-colors border border-blue-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bars"></i> Ver menú principal
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/50 px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-sliders mr-2 text-[var(--brand-light)]"></i>Personalizar</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre del alumno</label>
            <input id="settings-name-input" type="text" placeholder="Tu nombre" maxlength="40"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-5 focus:outline-none focus:ring-2 focus:ring-[var(--brand-light)]">

            <label class="block text-sm font-semibold text-gray-600 mb-2">Tema de colores</label>
            <div id="theme-swatches" class="grid grid-cols-5 gap-3 mb-6">
                <!-- Filled dynamically by JS -->
            </div>

            <button onclick="saveSettings()" class="w-full bg-[var(--brand-dark)] hover:opacity-90 text-white font-semibold py-2.5 rounded-lg transition-opacity">
                Guardar
            </button>
            <p class="text-xs text-gray-400 text-center mt-3">Se guarda solo en este navegador.</p>
        </div>
    </div>

    <!-- Header / Nav -->

                    <button onclick="changeView('week')" id="btn-week" class="nav-btn px-4 py-2 rounded-md text-sm font-medium transition-colors hover:bg-blue-800">Semana Completa</button>

            <button onclick="changeView('week')" id="btn-week-mob" class="nav-btn flex-1 py-3 text-sm font-medium text-center border-b-2 border-transparent transition-colors whitespace-nowrap px-4">Semana</button>
            <button onclick="changeView('moodle')" id="btn-moodle-mob" class="nav-btn flex-1 py-3 text-sm font-medium text-center border-b-2 border-transparent text-purple-300 transition-colors whitespace-nowrap px-4">
                <i class="fa-solid fa-list-check mr-1"></i> Moodle
            </button>
            <button onclick="changeView('exams')" id="btn-exams-mob" class="nav-btn flex-1 py-3 text-sm font-medium text-center border-b-2 border-transparent text-red-300 transition-colors whitespace-nowrap px-4">

            <button onclick="changeView('aleks')" id="btn-aleks-mob" class="nav-btn flex-1 py-3 text-sm font-medium text-center border-b-2 border-transparent text-emerald-300 transition-colors whitespace-nowrap px-4">

            <button onclick="openSettings()" id="btn-settings-mob" class="nav-btn flex-1 py-3 text-sm font-medium text-center border-b-2 border-transparent text-blue-200 transition-colors whitespace-nowrap px-4">

        let currentView = 'today';
        const today = new Date();
        let currentDayIndex = today.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
        let highlightCurrentClass = false;

        // ---------------------------------------------------------------
        // Personalization: student name, color theme, and task completion
        // are all saved locally in this browser (localStorage).
        // ---------------------------------------------------------------
        const STORAGE_KEYS = { name: 'schedule_studentName', theme: 'schedule_theme', completed: 'schedule_completedTasks' };

        const THEMES = {
            azul:    { label: 'Azul',    dark: '#1e3a8a', light: '#3b82f6' },
            verde:   { label: 'Verde',   dark: '#065f46', light: '#10b981' },
            morado:  { label: 'Morado',  dark: '#4c1d95', light: '#8b5cf6' },
            rosa:    { label: 'Rosa',    dark: '#9d174d', light: '#ec4899' },
            naranja: { label: 'Naranja', dark: '#7c2d12', light: '#f97316' }
        };

        function loadSetting(key, fallback) {
            try {
                const v = localStorage.getItem(key);
                return v === null ? fallback : v;
            } catch (e) { return fallback; }
        }
        function saveSetting(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
        }
        function loadCompletedTasks() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.completed);
                return raw ? JSON.parse(raw) : [];
            } catch (e) { return []; }
        }
        function saveCompletedTasks(arr) {
            try { localStorage.setItem(STORAGE_KEYS.completed, JSON.stringify(arr)); } catch (e) { /* ignore */ }
        }
        function toggleTaskCompleted(taskId) {
            const list = loadCompletedTasks();
            const idx = list.indexOf(taskId);
            if (idx === -1) list.push(taskId); else list.splice(idx, 1);
            saveCompletedTasks(list);
            renderView('moodle'); // re-render with updated state, keeping current filters
        }

        function applyTheme(themeKey) {
            const t = THEMES[themeKey] || THEMES.azul;
            document.documentElement.style.setProperty('--brand-dark', t.dark);
            document.documentElement.style.setProperty('--brand-light', t.light);
        }

        function applyStudentName(name) {
            const label = name && name.trim() ? name.trim() : 'Estudiante';
            const headerLabel = document.getElementById('student-name-label');
            if (headerLabel) headerLabel.textContent = label;
            const greeting = document.getElementById('entry-greeting');
            if (greeting) greeting.textContent = name && name.trim() ? `¡Hola, ${name.trim()}!` : '¡Hola!';
        }

        function renderThemeSwatches() {
            const container = document.getElementById('theme-swatches');
            if (!container) return;
            const activeTheme = loadSetting(STORAGE_KEYS.theme, 'azul');
            container.innerHTML = Object.entries(THEMES).map(([key, t]) => `
                <button type="button" onclick="selectThemeSwatch('${key}')" data-theme-key="${key}"
                    class="theme-swatch-btn flex flex-col items-center gap-1 group">
                    <span class="w-9 h-9 rounded-full border-2 ${key === activeTheme ? 'border-gray-800' : 'border-transparent'} flex items-center justify-center transition-all"
                        style="background: linear-gradient(135deg, ${t.dark}, ${t.light});">
                        ${key === activeTheme ? '<i class="fa-solid fa-check text-white text-xs"></i>' : ''}
                    </span>
                    <span class="text-[10px] text-gray-500">${t.label}</span>
                </button>
            `).join('');
        }

        let pendingThemeSelection = null;
        function selectThemeSwatch(key) {
            pendingThemeSelection = key;
            applyTheme(key); // live preview
            document.querySelectorAll('.theme-swatch-btn span:first-child').forEach(el => {
                el.classList.remove('border-gray-800');
                el.classList.add('border-transparent');
                el.innerHTML = '';
            });
            const btn = document.querySelector(`.theme-swatch-btn[data-theme-key="${key}"] span:first-child`);
            if (btn) {
                btn.classList.remove('border-transparent');
                btn.classList.add('border-gray-800');
                btn.innerHTML = '<i class="fa-solid fa-check text-white text-xs"></i>';
            }
        }

        function openSettings() {
            document.getElementById('settings-name-input').value = loadSetting(STORAGE_KEYS.name, '');
            pendingThemeSelection = loadSetting(STORAGE_KEYS.theme, 'azul');
            renderThemeSwatches();

        function saveSettings() {

        // ---- Pending Moodle task helpers (for the entry-screen reminder) ----
        function getPendingMoodleTasks() {
            const completed = loadCompletedTasks();
            const now = new Date();
            return moodleTasks
                .filter(t => !completed.includes(t.id))
                .map(t => ({ ...t, dueDate: new Date(t.due), overdue: new Date(t.due) < now }))
                .sort((a, b) => a.dueDate - b.dueDate);
        }

        // Format date for the header
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = today.toLocaleDateString('es-ES', options);
        const entryDateEl = document.getElementById('entry-date');
        if (entryDateEl) entryDateEl.textContent = today.toLocaleDateString('es-ES', options);

        // ---- Recess: every school day, 10:40–11:30, overrides whatever class is "scheduled" ----
        const RECESS = { start: 10 * 60 + 40, end: 11 * 60 + 30, startStr: '10:40', endStr: '11:30' };

        function timeStrToMinutes(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }
        function parseTimeRange(rangeStr) {
            const [s, e] = rangeStr.split('-').map(x => x.trim());
            return { start: timeStrToMinutes(s), end: timeStrToMinutes(e), startStr: s, endStr: e };
        }
        function formatMinutes(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            if (h > 0 && m > 0) return `${h} h ${m} min`;
            if (h > 0) return `${h} h`;
            return `${m} min`;
        }

        // Finds the first class of the next school day (Mon–Fri) starting from dayIdx.
        // inclusive=true also checks dayIdx itself.
        function findNextSchoolDayFirstClass(dayIdx, inclusive) {
            for (let offset = inclusive ? 0 : 1; offset <= 7; offset++) {
                const d = (dayIdx + offset) % 7;
                if (d >= 1 && d <= 5) {
                    const list = regularSchedule[d] || [];
                    if (list.length > 0) {
                        return { dayIdx: d, offsetDays: offset, cls: list[0] };
                    }
                }
            }
            return null;
        }

        // Computes what the student should be doing right now.
        function getScheduleStatus() {
            const now = new Date();
            const dayIdx = now.getDay();
            const nowMinutes = now.getHours() * 60 + now.getMinutes();
            const classesToday = (dayIdx >= 1 && dayIdx <= 5) ? (regularSchedule[dayIdx] || []) : [];

            function nextClassAfterNow() {
                for (const c of classesToday) {
                    const r = parseTimeRange(c.time);
                    if (r.start > nowMinutes) return { cls: c, range: r, sameDay: true };
                }
                const nxt = findNextSchoolDayFirstClass(dayIdx, false);
                return nxt ? { cls: nxt.cls, dayIdx: nxt.dayIdx, offsetDays: nxt.offsetDays, sameDay: false } : null;
            }

            // Weekend
            if (dayIdx === 0 || dayIdx === 6) {
                return { state: 'weekend', dayIdx, nowMinutes, next: findNextSchoolDayFirstClass(dayIdx, false) ? { ...findNextSchoolDayFirstClass(dayIdx, false), sameDay: false } : null };
            }

            // Recess always wins, regardless of what's "scheduled"
            if (nowMinutes >= RECESS.start && nowMinutes < RECESS.end) {
                return { state: 'recess', dayIdx, nowMinutes, next: nextClassAfterNow() };
            }

            // Currently inside a class block
            for (const c of classesToday) {
                const r = parseTimeRange(c.time);
                if (nowMinutes >= r.start && nowMinutes < r.end) {
                    return { state: 'class', dayIdx, nowMinutes, current: { cls: c, range: r }, next: nextClassAfterNow() };
                }
            }

            // Gap before/between classes today
            const next = nextClassAfterNow();
            if (next && next.sameDay) {
                return { state: 'gap', dayIdx, nowMinutes, next };
            }

            // Nothing left today
            return { state: classesToday.length ? 'after_school' : 'no_classes_today', dayIdx, nowMinutes, next };
        }

        // Returns minutes remaining until a "next" target ({sameDay, offsetDays, cls}) starts
        function minutesUntil(next) {
            if (!next) return null;
            const now = new Date();
            const target = new Date(now);
            if (!next.sameDay) target.setDate(target.getDate() + (next.offsetDays || 0));
            const r = parseTimeRange(next.cls.time);
            target.setHours(Math.floor(r.start / 60), r.start % 60, 0, 0);
            return Math.max(0, Math.round((target - now) / 60000));
        }

        function nextClassLabel(next) {
            if (!next) return null;
            const dayLabel = next.sameDay ? 'hoy' : (next.offsetDays === 1 ? 'mañana' : daysOfWeek[next.dayIdx]);
            return `${next.cls.subject} — ${dayLabel} a las ${parseTimeRange(next.cls.time).startStr}`;
        }

        function renderEntryScreen() {
            const status = getScheduleStatus();

                       <p class="text-sm text-[var(--brand-light)] font-semibold mt-1">${status.next.sameDay || status.next.offsetDays === 1 ? `Falta ${formatMinutes(minutesUntil(status.next))}` : `Falta ${formatMinutes(minutesUntil(status.next))}`}</p>
                   </div>`

            let mainBlock = '';
            if (status.state === 'class') {

            card.innerHTML = mainBlock + nextInfo;

            // "Ir a mi clase actual" only makes sense when there's something happening now
            const btnCurrent = document.getElementById('btn-go-current');
            if (status.state === 'weekend' || status.state === 'after_school' || status.state === 'no_classes_today') {
                btnCurrent.classList.add('hidden');

            // ---- Pending Moodle tasks reminder ----
            const reminder = document.getElementById('tasks-reminder');
            const pending = getPendingMoodleTasks();
            if (pending.length === 0) {

                const overdueCount = pending.filter(t => t.overdue).length;

                let icon = 'fa-circle-check', iconColor = 'text-emerald-500', headline = `Tienes ${pending.length} tarea${pending.length === 1 ? '' : 's'} pendiente${pending.length === 1 ? '' : 's'} en Moodle`;

                } else if (soonCount > 0) {
                    icon = 'fa-clock'; iconColor = 'text-amber-500';
                    headline = `${soonCount} tarea${soonCount === 1 ? '' : 's'} vence${soonCount === 1 ? '' : 'n'} pronto`;

        }

        // Keeps the currently selected filters so re-renders (e.g. after checking a task) don't reset them
        let moodleSubjectFilter = 'all';
        let moodleDateFilter = 'all';

        function renderMoodleView(container) {
            const subjects = [...new Set(moodleTasks.map(t => t.subject))];
            const completed = loadCompletedTasks();
            const now = new Date();

            const filterBar = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-5 flex flex-col sm:flex-row gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Materia</label>

                            ${subjects.map(s => `<option value="${s}" ${moodleSubjectFilter === s ? 'selected' : ''}>${s}</option>`).join('')}

                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Fecha</label>
                        <select id="moodle-date-filter" onchange="moodleDateFilter=this.value; renderMoodleView(document.getElementById('content-container'))"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400">
                            <option value="all" ${moodleDateFilter === 'all' ? 'selected' : ''}>Todas las fechas</option>
                            <option value="week" ${moodleDateFilter === 'week' ? 'selected' : ''}>Próximos 7 días</option>
                            <option value="overdue" ${moodleDateFilter === 'overdue' ? 'selected' : ''}>Vencidas</option>

                        </select>
                    </div>
                </div>
            `;

            let filtered = moodleTasks.map(t => ({ ...t, dueDate: new Date(t.due), opensDate: new Date(t.opens), isCompleted: completed.includes(t.id) }));

            if (moodleSubjectFilter !== 'all') filtered = filtered.filter(t => t.subject === moodleSubjectFilter);
            if (moodleDateFilter === 'week') filtered = filtered.filter(t => !t.isCompleted && (t.dueDate - now) / 3600000 <= 168 && t.dueDate >= now);
            if (moodleDateFilter === 'overdue') filtered = filtered.filter(t => !t.isCompleted && t.dueDate < now);
            if (moodleDateFilter === 'pending') filtered = filtered.filter(t => !t.isCompleted);

            filtered.sort((a, b) => a.dueDate - b.dueDate);

            let listHtml = '';
            if (filtered.length === 0) {
                listHtml = `<div class="bg-white rounded-xl border border-gray-200 p-10 text-center text-gray-400">
                    <i class="fa-solid fa-clipboard-check text-4xl mb-3"></i>
                    <p>No hay tareas que coincidan con este filtro.</p>
                </div>`;
            } else {
                listHtml = '<div class="space-y-3">' + filtered.map(t => {
                    const isOverdue = !t.isCompleted && t.dueDate < now;
                    const hoursLeft = (t.dueDate - now) / 3600000;
                    let statusBadge = `<span class="text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500">Con tiempo</span>`;
                    if (t.isCompleted) statusBadge = `<span class="text-xs font-bold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">Completada</span>`;
                    else if (isOverdue) statusBadge = `<span class="text-xs font-bold px-2 py-1 rounded-full bg-red-100 text-red-700">Vencida</span>`;
                    else if (hoursLeft <= 24) statusBadge = `<span class="text-xs font-bold px-2 py-1 rounded-full bg-amber-100 text-amber-700">Vence hoy</span>`;
                    else if (hoursLeft <= 168) statusBadge = `<span class="text-xs font-bold px-2 py-1 rounded-full bg-orange-100 text-orange-700">Esta semana</span>`;

                    const dueLabel = t.dueDate.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) +
                        ' · ' + t.dueDate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                    const opensLabel = t.opensDate.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });

                    return `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex ${t.isCompleted ? 'opacity-60' : ''}">
                            <div class="${t.color} w-1.5 flex-shrink-0"></div>
                            <div class="p-4 flex-grow flex items-start gap-3">
                                <input type="checkbox" ${t.isCompleted ? 'checked' : ''} onchange="toggleTaskCompleted('${t.id}')"
                                    class="mt-1.5 w-4 h-4 rounded border-gray-300 text-purple-600 focus:ring-purple-400 cursor-pointer flex-shrink-0">
                                <div class="flex-grow min-w-0">
                                    <div class="flex items-center justify-between gap-2 flex-wrap mb-1">
                                        <span class="text-xs font-bold uppercase tracking-wide text-gray-500">${t.subject}</span>
                                        ${statusBadge}
                                    </div>
                                    <p class="font-semibold text-gray-900 leading-snug ${t.isCompleted ? 'line-through' : ''}">${t.title}</p>
                                    <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-gray-500">
                                        <span><i class="fa-regular fa-calendar-check mr-1"></i>Entrega: ${dueLabel}</span>
                                        <span><i class="fa-regular fa-calendar-plus mr-1"></i>Abre: ${opensLabel}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('') + '</div>';
            }

            container.innerHTML = filterBar + listHtml;
        }

        // Initialize app on load: apply saved personalization, then show the status/entry screen first
        window.onload = () => {
            applyTheme(loadSetting(STORAGE_KEYS.theme, 'azul'));
            applyStudentName(loadSetting(STORAGE_KEYS.name, ''));
            renderEntryScreen();
        };

        // Close settings modal when clicking the dark backdrop
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'settings-modal') closeSettings();
        });

    </script>
</body>
</html>
