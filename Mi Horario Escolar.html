            pomoUpdateUI();
        }
        function pomoNext(completed) {
            clearInterval(pomo.timer); pomo.running = false;
            const wasFocus = pomo.mode === 'focus';
            if (wasFocus) {
                if (completed) { pomo.cycle++; addPomoCount(Math.round(pomoDur('focus') / 60)); }
                pomo.mode = (completed && pomo.cycle % 4 === 0) ? 'long' : 'short';
            } else pomo.mode = 'focus';
            pomo.remaining = pomoDur(pomo.mode);
            if (completed) {
                const msg = wasFocus ? '¡Bloque terminado! Toma tu descanso 🎉' : 'Fin del descanso. ¡A concentrarse! 💪';

            const cyc = $('pomo-cycle'); if (cyc) cyc.innerHTML = [0, 1, 2, 3].map(i => `<span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${i < pomo.cycle % 4 ? 'var(--brand-light)' : 'var(--border)'}"></span>`).join('');

        function renderPomo(b) {

        // ---- Ruido para concentrarse (Web Audio) ----
        const noise = { kind: null, node: null, gain: null, vol: 0.35 };
        function makeNoiseBuffer(ctx, kind) {
            const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
            let last = 0, b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

                if (kind === 'white') d[i] = w * 0.3;
                else if (kind === 'brown' || kind === 'rain') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; if (kind === 'rain' && Math.random() < 0.0015) d[i] += (Math.random() - .5) * .6; }
                else { b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852; b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;

            }
            return buf;
        }

            let out = src;

        // ---- Cifrado con contraseña (AES-GCM 256 + PBKDF2) ----
        const b64 = { enc: u8 => { let s = ''; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
            dec: s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return Uint8Array.from(bin, c => c.charCodeAt(0)); } };
        async function deriveKey(pass, salt) {
            const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
        }
        async function encryptText(text, pass) {
            const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pass, salt), new TextEncoder().encode(text));
            return { salt: b64.enc(salt), iv: b64.enc(iv), ct: b64.enc(new Uint8Array(ct)) };
        }
        async function decryptText(o, pass) {
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(o.iv) }, await deriveKey(pass, b64.dec(o.salt)), b64.dec(o.ct));
            return new TextDecoder().decode(pt);
        }
        function cryptoOk() { if (window.crypto && crypto.subtle) return true; showToast('El cifrado necesita abrir la app desde https (tu enlace de GitHub Pages).', 'warn'); return false; }
        function askPassword(title, msg, cb, confirmTwice = false) {

        function exportBackupEncrypted() {
            if (!cryptoOk()) return;

        function importBackup(input) {

                try { obj = JSON.parse(reader.result); if (obj.app !== 'mi-horario') throw new Error('formato'); } catch (e) { showToast('Ese archivo no es un respaldo válido.', 'danger'); return; }

        // ---- Sincronizar por enlace / QR (sin servidor: los datos viajan dentro del enlace) ----
        async function packData(pass) {
            let raw = new TextEncoder().encode(JSON.stringify(collectData()));
            if (window.CompressionStream) raw = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
            const z = window.CompressionStream ? 'z' : 'p';
            if (pass) { const enc = await encryptText(b64.enc(raw), pass); return `e${z}.${enc.salt}.${enc.iv}.${enc.ct}`; }
            return `${z}.${b64.enc(raw)}`;
        }
        async function unpackData(s, pass) {
            const parts = s.split('.');
            let kind = parts[0], bytes;
            if (kind[0] === 'e') { bytes = b64.dec(await decryptText({ salt: parts[1], iv: parts[2], ct: parts[3] }, pass)); kind = kind.slice(1); }
            else bytes = b64.dec(parts[1]);
            if (kind === 'z') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
            return JSON.parse(new TextDecoder().decode(bytes));
        }

                <button onclick="buildSyncLink()" class="btn btn-brand w-full"><i class="fa-solid fa-wand-magic-sparkles"></i>Generar</button>
                <div id="sync-out" class="mt-4"></div>`);
        }
        async function buildSyncLink() {
            const lock = $('sync-lock').checked, pass = val('sync-pass');
            if (lock && pass.length < 4) return showToast('Escribe una contraseña de al menos 4 caracteres.', 'warn');
            if (lock && !cryptoOk()) return;
            const packed = await packData(lock ? pass : '');
            const url = location.origin + location.pathname + '#sync=' + packed;
            window.__syncUrl = url;
            const out = $('sync-out');
            out.innerHTML = `<p class="lbl">Enlace (${Math.round(url.length / 1024)} KB)</p>
                <textarea readonly rows="3" class="field w-full text-xs" onclick="this.select()">${esc(url)}</textarea>
                <div class="flex flex-wrap gap-2 mt-2"><button onclick="copyText(__syncUrl, 'Enlace copiado 📋')" class="btn btn-ghost btn-sm"><i class="fa-regular fa-copy"></i>Copiar</button>
                <button onclick="shareText('Mis datos de Mi Horario', __syncUrl)" class="btn btn-ghost btn-sm"><i class="fa-solid fa-share-nodes"></i>Compartir</button></div>
                <div id="sync-qr" class="mt-4 flex justify-center"></div>`;
            if (url.length > 2900) { $('sync-qr').innerHTML = '<p class="text-xs text-gray-500 text-center">Tus datos son muy grandes para un QR; usa “Copiar” o “Compartir”.</p>'; return; }
            loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(() => {
                const box = $('sync-qr'); if (!box || !window.QRCode) return;
                box.innerHTML = '<div class="bg-white p-3 rounded-xl" id="sync-qr-in"></div>';
                new QRCode($('sync-qr-in'), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
            }).catch(() => { const box = $('sync-qr'); if (box) box.innerHTML = '<p class="text-xs text-gray-500">Sin conexión para generar el QR; usa “Copiar”.</p>'; });
        }
        function loadScript(src) {
            return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
        }
        async function handleSyncHash() {
            const m = location.hash.match(/^#sync=(.+)$/);
            if (!m) return false;
            const packed = m[1];

            const doImport = data => confirmBox('Este enlace trae datos de Mi Horario de otro dispositivo. ¿Reemplazar los datos de este navegador?', () => { applyData(data); showToast('Datos importados ✅', 'ok'); }, { yes: 'Importar', danger: false });
            try {
                if (packed[0] === 'e') {
                    if (!cryptoOk()) return true;
                    askPassword('Datos protegidos', 'Escribe la contraseña con la que se creó el enlace.', async pass => {
                        try { doImport(await unpackData(packed, pass)); } catch (e) { showToast('Contraseña incorrecta o enlace dañado.', 'danger'); }
                    });
                } else doImport(await unpackData(packed, ''));
            } catch (e) { showToast('El enlace de sincronización está incompleto o dañado.', 'danger'); }
            return true;
        }

        async function hashPin(pin, salt) {
            if (window.crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return b64.enc(new Uint8Array(h)); }
            let h = 0; for (const ch of salt + pin) h = (h * 31 + ch.charCodeAt(0)) | 0; return String(h);
        }
        let pinBuf = '', pinMode = 'unlock', pinFirst = '';
        function showPinPad(mode, msg) {
            pinMode = mode; pinBuf = '';
            $('lock-msg').textContent = msg;
            $('pin-pad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, 'ok'].map(k => k === 'x' ? `<button class="pin-key" onclick="pinKey('del')" aria-label="Borrar"><i class="fa-solid fa-delete-left"></i></button>`
                : k === 'ok' ? (mode === 'unlock' ? '<span></span>' : `<button class="pin-key" onclick="pinCancel()" aria-label="Cancelar"><i class="fa-solid fa-xmark"></i></button>`)
                : `<button class="pin-key" onclick="pinKey('${k}')">${k}</button>`).join('');
            pinDots();
            $('lock-screen').classList.remove('hidden');
        }
        function pinDots() { $('pin-dots').innerHTML = [0, 1, 2, 3].map(i => `<span class="pin-dot ${i < pinBuf.length ? 'on' : ''}"></span>`).join(''); }
        async function pinKey(k) {
            if (k === 'del') { pinBuf = pinBuf.slice(0, -1); pinDots(); return; }
            if (pinBuf.length >= 4) return;
            pinBuf += k; pinDots();
            if (pinBuf.length < 4) return;
            const entered = pinBuf;
            if (pinMode === 'unlock') {
                const stored = loadJSON(STORAGE_KEYS.pin, null);
                if (stored && await hashPin(entered, stored.salt) === stored.hash) { $('lock-screen').classList.add('hidden'); afterUnlock(); }
                else { $('pin-dots').classList.add('shake'); setTimeout(() => { $('pin-dots').classList.remove('shake'); pinBuf = ''; pinDots(); }, 450); vibrate([80, 60, 80]); }
            } else if (pinMode === 'set1') { pinFirst = entered; setTimeout(() => showPinPad('set2', 'Repite el PIN'), 150); }
            else if (pinMode === 'set2') {
                if (entered !== pinFirst) { showToast('Los PIN no coinciden. Intenta de nuevo.', 'warn'); setTimeout(() => showPinPad('set1', 'Elige un PIN de 4 dígitos'), 150); return; }
                const salt = b64.enc(crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(12)) : new Uint8Array(12));
                saveJSON(STORAGE_KEYS.pin, { salt, hash: await hashPin(entered, salt) });
                $('lock-screen').classList.add('hidden');
                showToast('PIN activado 🔒', 'ok'); if (isInApp()) renderView(currentView);
            }
        }
        function pinCancel() { $('lock-screen').classList.add('hidden'); if (isInApp()) renderView(currentView); }
        function setupPin() { showPinPad('set1', 'Elige un PIN de 4 dígitos'); }
        function removePin() { removeSetting(STORAGE_KEYS.pin); showToast('PIN desactivado', 'ok', 2500); renderView('settings'); }

        function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
        function openPalette() {
            openModal(`<div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input id="pal-q" class="field w-full pl-9 py-3 text-base" placeholder="Busca tareas, materias, secciones o acciones…" oninput="paletteFilter(this.value)" onkeydown="paletteKey(event)" autocomplete="off"></div>

            paletteFilter('');

        }
        function paletteFilter(q) {
            const all = paletteSource(), words = norm(q).split(/\s+/).filter(Boolean);
            paletteItems = (words.length ? all.filter(i => { const h = norm(i.label + ' ' + i.hint); return words.every(w => h.includes(w)); }) : all.filter(i => i.hint !== 'Tarea')).slice(0, 40);
            paletteSel = 0; paletteDraw();
        }
        function paletteDraw() {
            const l = $('pal-list'); if (!l) return;
            l.innerHTML = paletteItems.length ? paletteItems.map((i, k) => `<button class="cmd-item ${k === paletteSel ? 'sel' : ''}" onclick="paletteRun(${k})">
                <i class="fa-solid ${i.icon} w-5 text-center muted"></i><span class="flex-grow truncate">${esc(i.label)}</span><span class="text-xs muted whitespace-nowrap">${esc(i.hint)}</span></button>`).join('')
                : '<p class="text-sm text-gray-500 p-3">Sin resultados.</p>';
            const sel = l.querySelector('.sel'); if (sel) sel.scrollIntoView({ block: 'nearest' });
        }
        function paletteKey(e) {
            if (e.key === 'ArrowDown') { paletteSel = Math.min(paletteSel + 1, paletteItems.length - 1); paletteDraw(); e.preventDefault(); }
            else if (e.key === 'ArrowUp') { paletteSel = Math.max(paletteSel - 1, 0); paletteDraw(); e.preventDefault(); }

            ['Alertas', ['Elige cuándo avisar (2 días a 15 min)', 'Aviso antes de cada clase', 'Avisos de exámenes', 'Horas de silencio', 'Vibración', 'Resumen del día', 'Número de pendientes en la pestaña y en el ícono', 'Notificaciones vía service worker (Android)']],
            ['Datos y privacidad', ['Pasar datos por enlace o QR', 'Enlace protegido con contraseña', 'Respaldo cifrado AES-256', 'Recordatorio de respaldo', 'Exportar CSV (tareas y calificaciones)', '.ics de clases que salta exámenes y festivos', 'PIN de bloqueo', 'Espacio usado']],
            ['App', ['Instalable (PWA) y funciona sin internet', 'Barra inferior en el celular', 'Enlaces directos a cada sección (#tareas, #examenes…)', 'Botón Atrás funciona', 'Buscador Ctrl+K', 'Atajos de teclado', 'Modo enfoque', 'Modo negro AMOLED', '16 temas + tu color', 'Tamaño de letra', 'Modo compacto', 'Reducir animaciones', 'Asistente de bienvenida', 'Impresión de semana, tareas y exámenes']]
        ];
        function openChangelog() {
            const total = ALL_FEATURES.reduce((a, [, l]) => a + l.length, 0);
            openModal(`<div class="-mx-5 -mt-5 sm:-mx-6 sm:-mt-6 mb-4 app-header-bg text-white px-6 py-5 rounded-t-2xl">
                    <p class="text-xs font-bold uppercase tracking-widest text-white/70">¡Actualización!</p>
                    <h3 class="text-2xl font-extrabold mt-1">Novedades <span class="text-white/70 text-lg font-semibold">v${APP_VERSION}</span></h3>
                    <p class="text-sm text-white/80 mt-1">${total} mejoras nuevas. Tus datos se conservaron.</p></div>
                <div class="space-y-3">${CHANGELOG.map(c => `
                    <div class="flex gap-3 items-start">
                        <span class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-white" style="background:${c.color}"><i class="fa-solid ${c.icon}"></i></span>
                        <div><p class="font-bold text-gray-900 leading-tight">${c.title}</p><p class="text-sm text-gray-500 mt-0.5">${c.text}</p></div>
                    </div>`).join('')}</div>
                <details class="mt-4"><summary class="cursor-pointer text-sm font-semibold brand-text">Ver la lista completa (${total})</summary>
                    <div class="mt-3 space-y-3">${ALL_FEATURES.map(([g, l]) => `<div><p class="sec-title mb-1">${g}</p><ul class="text-sm text-gray-600 list-disc pl-5 space-y-0.5">${l.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div></details>
                <button onclick="closeModal()" class="w-full btn-brand font-semibold py-3 rounded-xl mt-5">¡Entendido, vamos!</button>`,
                { sheet: false, onClose: () => saveSetting(STORAGE_KEYS.seenVersion, APP_VERSION) });
        }
        function maybeShowChangelog() {
            const seen = loadSetting(STORAGE_KEYS.seenVersion, '');
            const isNew = !seen && !loadSetting(STORAGE_KEYS.name, '') && !loadSetting(STORAGE_KEYS.onboarded, '') && !loadCompletedTasks().length;
            if (isNew) { setTimeout(openOnboarding, 500); return; }
            if (seen !== APP_VERSION) setTimeout(openChangelog, 500);
        }

        // ---------------------------------------------------------------
        // Confeti
        // ---------------------------------------------------------------
        function confetti() {
            if (P.reduceMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
            const c = $('confetti'), ctx = c.getContext && c.getContext('2d'); if (!ctx) return;
            c.width = innerWidth; c.height = innerHeight; c.classList.remove('hidden');
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
            const parts = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight * .65, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5, s: Math.random() * 6 + 4, c: colors[Math.floor(Math.random() * colors.length)], r: Math.random() * 6, vr: (Math.random() - .5) * .3 }));
            let t = 0;
            (function frame() {
                ctx.clearRect(0, 0, c.width, c.height);
                parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.vx *= .99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
                if (++t < 110) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, c.width, c.height); c.classList.add('hidden'); }
            })();
        }

        // ---------------------------------------------------------------
        // Instalar como app (PWA) + service worker
        // ---------------------------------------------------------------
        let deferredInstall = null;
        const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (!isInApp()) renderEntryScreen(); });
        window.addEventListener('appinstalled', () => { deferredInstall = null; showToast('¡Mi Horario quedó instalada! 📲', 'ok'); });
        function installApp() {
            if (!deferredInstall) return showToast('Usa el menú del navegador → “Agregar a la pantalla principal”.', 'info');
            deferredInstall.prompt();
            deferredInstall.userChoice.finally(() => { deferredInstall = null; if (!isInApp()) renderEntryScreen(); });
        }
        function registerSW() {
            if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
            navigator.serviceWorker.register('mi-horario-sw.js').then(reg => {
                swReg = reg;
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    if (nw) nw.addEventListener('statechange', () => {
                        if (nw.state === 'installed' && navigator.serviceWorker.controller)
                            showToast('Hay una versión nueva de Mi Horario.', 'info', 15000, { label: 'Actualizar', fn: () => location.reload() });
                    });
                });
            }).catch(() => { /* sin service worker: la app sigue funcionando */ });
        }

        // =================================================================
        // INICIO
        // =================================================================
        function minuteRefresh() {
            updateDates(); updateNavBadge();
            if (!isInApp()) { renderEntryScreen(); return; }
            const a = document.activeElement;
            if (a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName)) return; // no interrumpir mientras escribe
            if ($('modal-root').innerHTML) return;
            if (['today', 'tasks', 'exams', 'calendar', 'subject'].includes(currentView)) renderView(currentView);
        }

        function boot() {
            applyTheme(loadSetting(STORAGE_KEYS.theme, 'azul'));
            applyMode(loadSetting(STORAGE_KEYS.mode, 'auto'));
            applyLayoutPrefs();
            applyStudentName(loadSetting(STORAGE_KEYS.name, ''));
            buildNav();
            updateDates();
            renderEntryScreen();
            tickCountdowns();
            loadWeather();
            updateNavBadge();

            handleSyncHash().then(isSync => {
                if (isSync) return;
                if (location.hash && location.hash !== '#') { routeFromHash(); }
                maybeShowChangelog();
                dailySummary();
                maybeBackupReminder();
            });
            checkAchievements();

            let n = 0;
            setInterval(() => {
                n++;
                tickCountdowns(); updateUrgentBar();
                if (n % 30 === 0) checkAlerts();
                if (n % 60 === 0) minuteRefresh();
            }, 1000);
            setTimeout(checkAlerts, 1500);
            // Al volver a la pestaña, refrescar todo (los temporizadores se pausan en segundo plano)
            document.addEventListener('visibilitychange', () => { if (!document.hidden) { minuteRefresh(); checkAlerts(); if (wakeLock === null && pomo.running) keepAwake(true); } });

            // Seguir el modo del dispositivo cuando está en "Auto"
            if (window.matchMedia) {
                const mq = window.matchMedia('(prefers-color-scheme: dark)');
                const onChange = () => { if (loadSetting(STORAGE_KEYS.mode, 'auto') === 'auto') applyMode('auto'); };
                mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener && mq.addListener(onChange);
                const wide = window.matchMedia('(min-width: 768px)');
                const onWide = () => { if (isInApp() && currentView === 'week') renderView('week'); };
                wide.addEventListener ? wide.addEventListener('change', onWide) : wide.addListener && wide.addListener(onWide);
            }
            // Estado de red
            const offBar = $('offline-bar');
            const syncNet = () => offBar.classList.toggle('hidden', navigator.onLine);
            window.addEventListener('online', () => { syncNet(); showToast('De nuevo en línea ✅', 'ok', 2500); loadWeather(); });
            window.addEventListener('offline', syncNet);
            syncNet();
            registerSW();
        }

        window.onload = () => {
            const pin = loadJSON(STORAGE_KEYS.pin, null);
            if (pin && pin.hash) { afterUnlock = boot; showPinPad('unlock', 'Escribe tu PIN'); }
            else boot();
        };

        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'modal-back') closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (!$('lock-screen').classList.contains('hidden')) {
                if (/^[0-9]$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del');
                return;
            }
            if (e.key === 'Escape') {
                if ($('modal-root').innerHTML) { closeModal(); return; }
                if (!$('focus-overlay').classList.contains('hidden')) { closeFocus(); return; }
                return;
            }
            const tag = (e.target && e.target.tagName) || '';
            const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || (e.target && e.target.isContentEditable);
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
            if (typing || e.ctrlKey || e.metaKey || e.altKey || $('modal-root').innerHTML) return;
            const navViews = VIEWS.filter(v => v.nav !== false);
            if (/^[1-8]$/.test(e.key) && navViews[+e.key - 1]) { changeView(navViews[+e.key - 1].id); return; }
            const k = e.key.toLowerCase();
            if (k === '/') { e.preventDefault(); openPalette(); }
            else if (k === 'n') { e.preventDefault(); openTaskEditor(); }
            else if (k === 'f') openFocus();
            else if (k === 't') toggleDark();
            else if (e.key === '?') openShortcuts();
            else if (isInApp() && currentView === 'today' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) shiftTodayDate(e.key === 'ArrowLeft' ? -1 : 1);
        });

    </script>
</body>
