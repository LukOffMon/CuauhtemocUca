# Producción con HTTPS automático (Caddy + Let's Encrypt).
# 1) Apunta tu dominio (registro A/AAAA) a la IP del servidor.
# 2) Crea .env con: npm run keys  (o copia .env.example y pega claves de `npm run keys -- --print`).
# 3) En .env pon NODE_ENV=production, APP_ORIGIN=https://tu-dominio y TRUST_PROXY=1.
# 4) DOMAIN=tu-dominio docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: 1
      DATABASE_PATH: /app/data/mi-horario.db
    volumes:
      - app-data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN, por ejemplo DOMAIN=horario.midominio.mx}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
