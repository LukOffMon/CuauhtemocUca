<style>
/* Grey~Spell — mobile first: una columna con pestañas abajo; en escritorio, barra lateral + camino + riel de metas */
:root{
  --bg:#ECEEF2; --bg2:#E1E4EA; --card:#FFFFFF; --ink:#161A22; --ink2:#454D5E; --mute:#717B8D; --line:#D3D8E1;
  --acc:#3046E8; --acc-2:#1F31B8; --acc-soft:#E2E6FF; --on-acc:#FFFFFF;
  --ok:#1B9350; --ok-2:#137140; --ok-soft:#DCF4E6; --bad:#D2363E; --bad-2:#A4232A; --bad-soft:#FBE2E3;
  --gold:#E3A00F; --flame:#EE5A24; --gem:#C27A22;
  --mascot:#9CA2AD; --mascot-d:#737A86; --pix:#151820; --beret:#1D2236; --tan:#D8A35A; --white:#FFFFFF; --navy:#2A3FBF; --red:#D33A3A; --tear:#58A6F0; --pink:#F27BB0; --book:#B5452F; --paper:#F4F1E8; --glass:#7FD3F7; --blond:#F2C94C; --steel:#8E99A8; --fur:#6B4A35; --green2:#1E8E4E;
  --A1:#0F9C86; --A2:#4A9A2B; --B1:#2C78D8; --B2:#4A4FD3; --C1:#8740CC; --C2:#C3336B; --lock:#C4C9D3;
  --f-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-b:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif; --f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:18px; --sh:0 1px 0 rgba(20,24,34,.04),0 12px 30px -18px rgba(20,24,34,.35); --tab:72px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1117; --bg2:#161A23; --card:#1A1F29; --ink:#E8EBF1; --ink2:#B3BBCA; --mute:#8590A3; --line:#2A303C;
  --acc:#7A8EFF; --acc-2:#4E61D9; --acc-soft:#222A4C; --on-acc:#0B1030;
  --ok:#3CC57A; --ok-2:#24914F; --ok-soft:#163222; --bad:#FF6A70; --bad-2:#C23E45; --bad-soft:#3A1B20;
  --gold:#F2B630; --flame:#FF7440; --gem:#E09A45; --mascot:#A9AFBA; --mascot-d:#7E8592; --pix:#0A0C10; --beret:#0A0D18; --lock:#3A404D; --paper:#E6E1D3;
  --sh:0 1px 0 rgba(0,0,0,.2),0 14px 32px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1117; --bg2:#161A23; --card:#1A1F29; --ink:#E8EBF1; --ink2:#B3BBCA; --mute:#8590A3; --line:#2A303C;
  --acc:#7A8EFF; --acc-2:#4E61D9; --acc-soft:#222A4C; --on-acc:#0B1030;
  --ok:#3CC57A; --ok-2:#24914F; --ok-soft:#163222; --bad:#FF6A70; --bad-2:#C23E45; --bad-soft:#3A1B20;
  --gold:#F2B630; --flame:#FF7440; --gem:#E09A45; --mascot:#A9AFBA; --mascot-d:#7E8592; --pix:#0A0C10; --beret:#0A0D18; --lock:#3A404D; --paper:#E6E1D3;
  --sh:0 1px 0 rgba(0,0,0,.2),0 14px 32px -18px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box} [hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-d);letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.15}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--f-m)} .small{font-size:13px} .center{text-align:center} .sub{color:var(--mute);font-weight:700} .mt{margin-top:14px} .mt0{margin-top:4px} .mb{margin-bottom:16px} .gap10{height:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* ---------- layout (móvil) ---------- */
#app{min-height:100vh}
.side,.rail{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(var(--tab) + 28px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg);max-width:660px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font:800 20px/1 var(--f-d);letter-spacing:-.02em;white-space:nowrap}
.logo .tilde{font-family:var(--f-m);color:var(--acc);font-weight:700;margin:0 1px}
.logo-m{width:38px;flex:none;display:block}
.topbar .logo-t{display:none}
.chips{display:flex;gap:2px;align-items:center;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 8px;border-radius:12px;font:700 15px/1 var(--f-m);color:var(--ink2);min-height:40px}
.chip:hover{background:var(--bg2)} .chip .ic{font-size:18px;line-height:1}
.chip.fire b{color:var(--flame)} .chip.gem b{color:var(--gem)} .chip.xp b{color:var(--acc)} .chip.flag{border:2px solid var(--line);background:var(--card)}
.chip.dim .ic{filter:grayscale(1);opacity:.55}
.view{max-width:660px;margin:0 auto}
.view.enter{animation:viewin .28s ease-out}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
.tabs{display:flex;position:fixed;inset:auto 0 0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;min-height:var(--tab)}
.nav-b{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;border:2px solid transparent;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:left;transition:background .15s,color .15s}
.nav-b svg{width:26px;height:26px;flex:none}
.tabs .nav-b{flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;flex:1;min-width:0;letter-spacing:.04em}
.nav-b[aria-current="page"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.tabs .nav-b[aria-current="page"] svg{animation:tabpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabpop{40%{transform:scale(1.25) translateY(-2px)}}
@media (min-width:360px){.topbar .logo-t{display:inline}}
@media (max-width:519px){.hide-s{display:none}}

/* ---------- layout (tablet / escritorio) ---------- */
@media (min-width:760px){
  #app{display:grid;grid-template-columns:96px minmax(0,1fr)}
  .side{display:flex;position:sticky;top:0;height:100vh;padding:20px 12px;border-right:2px solid var(--line);flex-direction:column;gap:4px;overflow-y:auto}
  .side .logo{justify-content:center;padding:4px 0 18px} .side .logo-t,.side .nav-b span{display:none} .side .nav-b{justify-content:center}
  .tabs{display:none} .main{padding-bottom:48px} .topbar .logo{display:none}
}
@media (min-width:1080px){ #app{grid-template-columns:96px minmax(0,1fr) 310px} .rail{display:flex;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 22px 20px 4px;flex-direction:column;gap:14px} }
@media (min-width:1280px){ #app{grid-template-columns:236px minmax(0,1fr) 320px} .side .logo{justify-content:flex-start;padding:4px 10px 18px} .side .logo-t,.side .nav-b span{display:inline} .side .nav-b{justify-content:flex-start} }

/* ---------- piezas comunes ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:18px;margin-bottom:8px}
.eyebrow{font:700 11.5px/1.25 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:16px;background:var(--acc);color:var(--on-acc);box-shadow:0 4px 0 var(--acc-2);font-weight:900;font-size:15px;letter-spacing:.07em;text-transform:uppercase;transition:transform .07s,box-shadow .07s,filter .15s;text-align:center}
.btn svg{width:20px;height:20px}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acc-2)}
.btn[disabled]{background:var(--bg2);color:var(--mute);box-shadow:0 4px 0 var(--line);cursor:default;filter:none;transform:none}
.btn.ghost{background:var(--card);color:var(--acc);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-2);color:#fff} .btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-2);color:#fff}
.btn.danger{color:var(--bad)} .btn.block{width:100%} .btn.sm{min-height:42px;padding:8px 14px;font-size:13px}
.row-btn{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px} .row-btn .btn{flex:1 1 140px} .center-row{justify-content:center} .center-row .btn{flex:0 1 auto}
.link{color:var(--acc);font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:10px 0}
.bar{width:100%;height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .6s cubic-bezier(.3,1,.4,1)}
.bar.acc i{background:var(--acc)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sec-h h2{font-size:26px} .sec-h p{margin:4px 0 0;color:var(--mute);font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:560px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:inline-flex;background:var(--bg2);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--acc);box-shadow:0 1px 0 var(--line),0 2px 6px -3px rgba(0,0,0,.2)}
.big-seg{display:flex;margin-bottom:14px} .big-seg button{flex:1;justify-content:center;min-height:44px;font-size:14px}
.sw-dot{width:14px;height:14px;border-radius:50%;border:3px solid}
.pop-in{animation:popin .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.85);opacity:0}}
.shake-x{animation:shakex .35s}
@keyframes shakex{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pulse{animation:pulseb .4s}
@keyframes pulseb{50%{transform:scale(1.12)}}

/* ---------- Grisou: animaciones por partes ---------- */
.masc{display:block;width:100%;height:auto;overflow:visible;color:var(--ink)}
.masc g,.masc rect,.masc ellipse,.masc text{transform-box:fill-box;transform-origin:center}
.masc .m-root{transform-origin:50% 100%}
.m-armRup,.m-armLup{opacity:0}
.m-eyes{animation:blink 5.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.m-look{animation:look 8s steps(1) infinite}
@keyframes look{0%,55%{transform:none}57%,66%{transform:translateX(-1px)}68%,78%{transform:translateX(1px)}80%{transform:none}}
.m-stache{animation:twitch 6s infinite}
@keyframes twitch{0%,88%,100%{transform:none}90%,94%{transform:translateY(-.35px) scaleX(1.06)}92%{transform:none}}
.a-idle .m-body,.a-read .m-body,.a-sleep .m-body{animation:breathe 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(.96) scaleX(1.015)}}
.a-sleep .m-body{animation-duration:4.6s} .a-sleep .m-eyes,.a-sleep .m-stache{animation:none}
.m-z text{animation:zz 2.6s ease-out infinite;opacity:0} .m-z text:nth-child(2){animation-delay:1.3s}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(2px,-4px) scale(1.1);opacity:0}}
.a-walk .m-l0{animation:legup .56s steps(1) infinite} .a-walk .m-l1{animation:legup .56s steps(1) infinite .28s}
@keyframes legup{0%{transform:translateY(-1px)}50%{transform:none}}
.a-walk .m-body{animation:bob .56s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-.5px)}}
.a-hop .m-root,.a-cheer .m-root,.a-party .m-root{animation:hop .9s cubic-bezier(.3,.7,.4,1) infinite}
.a-party .m-root{animation-duration:1.1s}
@keyframes hop{0%{transform:translateY(0) scale(1.08,.9)}22%{transform:translateY(-3px) scale(.94,1.07)}48%{transform:translateY(-3.6px) scale(1)}74%{transform:translateY(0) scale(1.1,.88)}90%,100%{transform:translateY(0) scale(1)}}
.a-hop .m-shadow,.a-cheer .m-shadow,.a-party .m-shadow{animation:shad .9s infinite}
@keyframes shad{22%,48%{transform:scaleX(.55);opacity:.06}}
.a-hop .m-armL,.a-hop .m-armR,.a-cheer .m-armL,.a-cheer .m-armR,.a-party .m-armL,.a-party .m-armR{animation:adown .9s steps(1) infinite}
.a-hop .m-armLup,.a-hop .m-armRup,.a-cheer .m-armLup,.a-cheer .m-armRup,.a-party .m-armLup,.a-party .m-armRup{animation:aup .9s steps(1) infinite}
@keyframes aup{0%{opacity:0}18%{opacity:1}72%{opacity:0}} @keyframes adown{0%{opacity:1}18%{opacity:0}72%{opacity:1}}
.a-wave .m-armR{animation:wd .7s steps(1) infinite} .a-wave .m-armRup{animation:wu .7s steps(1) infinite}
@keyframes wu{0%{opacity:1}50%{opacity:0}} @keyframes wd{0%{opacity:0}50%{opacity:1}}
.a-wave .m-root{animation:sway 1.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.a-dance .m-root{animation:dance .5s steps(2) infinite} .a-dance .m-armLup{animation:wu .5s steps(1) infinite} .a-dance .m-armL{animation:wd .5s steps(1) infinite} .a-dance .m-armRup{animation:wd .5s steps(1) infinite} .a-dance .m-armR{animation:wu .5s steps(1) infinite}
@keyframes dance{0%{transform:translateX(-.6px) rotate(-5deg)}50%{transform:translateX(.6px) rotate(5deg)}}
.a-spin .m-root{animation:flip .7s ease-in-out 2}
@keyframes flip{50%{transform:scaleX(-1) translateY(-2px)}}
.a-sad .m-root{animation:droop 2.6s ease-in-out infinite}
@keyframes droop{50%{transform:translateY(.4px) rotate(-2deg) scaleY(.97)}}
.m-tear{animation:tear 1.7s ease-in infinite}
@keyframes tear{0%{transform:none;opacity:0}20%{opacity:1}100%{transform:translateY(4px);opacity:0}}
.a-think .m-root{animation:tilt 3.2s ease-in-out infinite}
@keyframes tilt{50%{transform:rotate(-3deg)}}
.m-dots rect{animation:dot 1.5s infinite;opacity:.2} .m-dots .d2{animation-delay:.25s} .m-dots .d3{animation-delay:.5s}
@keyframes dot{50%{opacity:1}}
.a-float .m-root{animation:float 4.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-1.2px) rotate(2deg)}}
.a-read .m-prop{animation:bob 2.4s ease-in-out infinite}
.m-conf .cf{animation:cf 1.4s ease-in infinite} .m-conf .c1{animation-delay:.2s}.m-conf .c2{animation-delay:.45s}.m-conf .c3{animation-delay:.7s}.m-conf .c4{animation-delay:.9s}.m-conf .c5{animation-delay:1.1s}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(7px) rotate(180deg);opacity:0}}
.a-none *{animation:none!important}

/* ---------- inicio y camino ---------- */
.hero{display:flex;gap:12px;align-items:center;margin-top:4px;padding:14px}
.hero-m{width:88px;flex:none;padding:6px 4px;border-radius:16px;background:var(--bg2)}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hero-h{font-family:var(--f-d);font-size:19px;line-height:1.2}
.bubble-s{align-self:flex-start;position:relative;background:var(--acc-soft);color:var(--ink);padding:5px 10px;border-radius:12px;font-size:14px;max-width:100%}
.bubble-s b{color:var(--acc)} .bubble-s span{color:var(--ink2);font-weight:700}
.bubble-s.pop{animation:popin .3s cubic-bezier(.3,1.6,.5,1)}
.duecard{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px;border-radius:var(--r);background:var(--acc);color:var(--on-acc);text-align:left;box-shadow:0 4px 0 var(--acc-2)}
.duecard>span{font-size:30px} .duecard div{flex:1;min-width:0} .duecard b{display:block;font-family:var(--f-d);font-size:17px} .duecard small{opacity:.85;font-weight:700} .duecard svg{width:24px;transform:rotate(90deg)}
.lvl-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 4px}
.lvl-head h3{font-size:20px} .lvl-head span{font:700 12px var(--f-m);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.unit{margin:16px 0 30px}
.band{position:relative;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-radius:var(--r);background:var(--lv);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--lv) 68%,#000);overflow:hidden}
.band::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 6px,transparent 6px 14px);border-radius:50%;pointer-events:none}
.band-t{min-width:0;flex:1}
.band .eyebrow{color:rgba(255,255,255,.85)} .band h2{font-size:23px;margin:4px 0 2px} .band p{margin:0;font-weight:700;opacity:.92;font-size:15px}
.band-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden;max-width:220px} .band-bar i{display:block;height:100%;background:#fff;border-radius:4px}
.bb{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 10px;border-radius:14px;border:2px solid rgba(255,255,255,.45);font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.bb:hover{background:rgba(255,255,255,.14)} .bb svg{width:22px;height:22px}
.nodes{list-style:none;margin:0;padding:60px 0 6px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow-x:clip}
.nodes li{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--x) * .78))}
@media (min-width:480px){.nodes li{transform:translateX(var(--x))}}
.node{position:relative;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:var(--lv);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--lv) 62%,#000),inset 0 -6px 0 rgba(0,0,0,.08);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--lv) 62%,#000)}
.node svg{width:32px;height:32px;position:relative;z-index:1}
.node.boss{border-radius:26px;width:84px}
.node.lock{background:var(--lock);box-shadow:0 6px 0 color-mix(in srgb,var(--lock) 72%,#000);color:var(--card)}
.node.done{background:var(--gold);box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 68%,#000)}
.ring{position:absolute;inset:-9px;border-radius:inherit;background:conic-gradient(var(--lv) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));pointer-events:none}
